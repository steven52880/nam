openapi: 3.0.3
info:
  title: nam API
  version: 0.1.0
  description: |
    nam 管理接口。两种运行模式路径相同，统一在 /api/nam 下。
    所有响应都是 {success, message, data} 信封；失败时 HTTP 状态码表示错误类别
    （400 参数错误、401 未登录、403 非 root、404 不存在、409 冲突、429 锁定、5xx 服务端或 NewAPI 出错）。
    嵌入模式：使用 NewAPI 会话 cookie，并带 New-Api-User 头（取 localStorage user.id）。
    独立模式：使用 nam_session cookie。
    M1 只包含下面这些接口；后续里程碑在此文件追加。
servers:
  - url: /api/nam
components:
  schemas:
    Envelope:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
    Identity:
      type: object
      properties:
        user_id: { type: integer }
        username: { type: string }
        role: { type: integer, description: 100 = root }
    Session:
      type: object
      properties:
        mode: { type: string, enum: [embedded, standalone] }
        identity: { $ref: '#/components/schemas/Identity' }
        version: { type: string }
    BackendInfo:
      type: object
      properties:
        mode: { type: string }
        version: { type: string }
        address: { type: string }
        patch_p1: { type: boolean }
        quota_per_unit: { type: number }
        last_request_at: { type: integer }
        last_error: { type: string }
    UpstreamType:
      type: string
      enum: [newapi, sk-key, sub2api, onehub, official, generic]
    CredType:
      type: string
      description: cookie 只能用于 newapi / onehub；sub2api_session 只能用于 sub2api。
      enum: ['', access_token, password, sk_key, cookie, sub2api_session]
    Credential:
      type: object
      properties:
        access_token: { type: string }
        username: { type: string }
        password: { type: string }
        key: { type: string }
        cookie: { type: string, description: cookie 类型。session 的值；也接受 session=值 或整串 Cookie 头，服务端清洗后只存值 }
        refresh_token: { type: string, description: sub2api_session 类型 }
        expires_at: { type: integer, description: sub2api_session 的 access_token 过期时间（Unix 秒）。由服务端从 JWT 算出，请求里的值被忽略 }
    UpstreamInput:
      type: object
      description: 创建时 name/type/base_url 必填；修改时只传要改的字段。credential 传空对象表示清除凭证。
      properties:
        name: { type: string, maxLength: 64 }
        type: { $ref: '#/components/schemas/UpstreamType' }
        base_url: { type: string, description: 根地址，不带 /v1，末尾斜杠会被去掉 }
        cred_type: { $ref: '#/components/schemas/CredType' }
        credential: { $ref: '#/components/schemas/Credential' }
        platform_user_id: { type: integer }
        currency_rate: { type: number, exclusiveMinimum: true, minimum: 0, description: 上游货币汇率（元 / 上游 1 美元额度） }
        tags: { type: string, description: 逗号分隔 }
        remark: { type: string }
        adapter_config: { type: string, description: JSON 字符串，仅 generic }
    SyncPart:
      type: object
      description: 上游某一部分最近一次同步的结果
      properties:
        state: { type: string, enum: [ok, fail, unsupported, empty], description: ok 成功 / fail 拉取失败 / unsupported 该上游类型不支持 / empty 成功但没有数据（仅 model_prices） }
        at: { type: integer, description: 同步时间（Unix 秒） }
        message: { type: string }
        count: { type: integer, nullable: true, description: 令牌数 / 分组数 / 模型价格条数；balance 为 null }
    Upstream:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { $ref: '#/components/schemas/UpstreamType' }
        base_url: { type: string }
        cred_type: { $ref: '#/components/schemas/CredType' }
        has_credential: { type: boolean }
        platform_user_id: { type: integer }
        currency_rate: { type: number }
        tags: { type: string }
        remark: { type: string }
        adapter_config: { type: string }
        balance_usd: { type: number, nullable: true }
        balance_cny: { type: number, nullable: true, description: balance_usd × currency_rate }
        balance_at: { type: integer }
        last_sync_at: { type: integer }
        last_sync_error: { type: string }
        sync_parts:
          type: object
          description: 各部分最近一次同步结果；缺少某一项 = 还没同步过。model_prices 随 groups 一起更新。
          properties:
            balance: { $ref: '#/components/schemas/SyncPart' }
            tokens: { $ref: '#/components/schemas/SyncPart' }
            groups: { $ref: '#/components/schemas/SyncPart' }
            model_prices: { $ref: '#/components/schemas/SyncPart' }
        cred_updated_at: { type: integer, description: 凭证最后修改时间（Unix 秒）；API 写入或自动续期写回时更新 }
        cred_expires_at: { type: integer, description: cookie 凭证的预计过期时间（Unix 秒，签发时间 + 30 天）；其他类型或未知为 0 }
        token_count: { type: integer }
        channel_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NewAPIChannel:
      type: object
      properties:
        id: { type: integer }
        type: { type: integer }
        name: { type: string }
        base_url: { type: string }
        models: { type: array, items: { type: string } }
        group: { type: string }
        priority: { type: integer }
        weight: { type: integer }
        tag: { type: string }
        status: { type: integer, description: 1 启用 / 2 手动禁用 / 3 自动禁用 }
        test_model: { type: string }
        response_time: { type: integer }
        test_time: { type: integer }
        balance: { type: number }
        used_quota: { type: integer }
        created_time: { type: integer }
    JobStatus:
      type: object
      properties:
        name: { type: string, enum: [balance, ratio, price_book, announcements, pull_logs, pricing, consistency, cleanup, backup] }
        title: { type: string }
        interval_s: { type: integer }
        last_start: { type: integer }
        last_duration_ms: { type: integer }
        last_result: { type: string, enum: ['', ok, fail] }
        last_message: { type: string }
        running: { type: boolean }
        queued: { type: boolean }
        next_at: { type: integer }
    Settings:
      type: object
      description: 字符串键值。job_interval.<job> 为 Go duration（如 30m、6h；定价任务默认 1h）。site_rate 只读，修改走定价流程（第二批）。protect_threshold 变化保护阈值（大于 0，默认 0.5）。pricing_auto_write（true/false，默认 false）：定价任务自动写入跟随模式厂商；旧键 auto_write 已废弃（返回 400）。pricing_min_change 最小变动（0 ≤ x < 1，默认 0.02）：变化低于它时定时任务不写，手动写入不受限。修改 usd_cny_rate 后各厂商分组倍率需要重新写入。usd_cny_rate 是美元参考汇率（元 / 1 美元，默认 7.2，须为大于 0 且不超过 100 的数字，否则 400）；成本类数值 channel_cost、effective_cost_price、measured_cost_price、std_cost_price 都除以它，得到原厂价的倍数（无单位）。cost_cny、revenue_cny、unit_cost（元）、discount、currency_rate、margin 不受影响。
      additionalProperties: { type: string }
      example:
        site_rate: '7'
        usd_cny_rate: '7.2'
        protect_threshold: '0.5'
        pricing_auto_write: 'false'
        pricing_min_change: '0.02'
        log_retention_days: '30'
        stats_retention_days: '180'
        job_interval.balance: 30m0s
    VendorPricingItem:
      type: object
      description: |
        一个厂商的定价。价格都是<u>原厂价的倍数</u>（0.3 = 30%）。厂商分组倍率 = 售价 × 美元参考汇率 ÷ 站点汇率（四舍五入到 3 位小数；舍入后为 0 的售价不能写入）。
        nam 不存 NewAPI 已有的值：固定模式的目标倍率 = draft_ratio（还没写入的修改），没有草稿时 = NewAPI 当前的 GroupRatio；跟随模式的目标售价 = 参考成本 × 加价比例，NewAPI 里被手改过也以 nam 为准写回。
        markup 只在跟随模式有意义。数值字段可为 null。
      properties:
        vendor_id: { type: integer }
        vendor: { type: string }
        group: { type: string }
        order: { type: integer }
        mode: { type: string, enum: [fixed, follow] }
        markup: { type: number, nullable: true, description: 加价比例：跟随模式售价 = 参考成本 × 加价比例（4 位小数） }
        sell_price: { type: number, nullable: true, description: 当前目标售价 = 目标倍率 × 站点汇率 ÷ 美元参考汇率（固定模式；跟随模式等于 target_price） }
        reference:
          type: object
          nullable: true
          description: 参考成本：该分组下 NewAPI 已生效、启用、有上游渠道售价的渠道中，priority 最大的一层按 weight 加权平均（权重全 0 取简单平均）。null = 无可用渠道
          properties:
            cost: { type: number }
            priority: { type: integer }
            channels:
              type: array
              items: { type: object, properties: { id: { type: integer }, name: { type: string }, weight: { type: integer }, channel_cost: { type: number } } }
        target_price: { type: number, nullable: true, description: 目标售价（固定模式 = sell_price；跟随模式 = 参考成本 × 加价比例；待确认时是将要写入的新售价） }
        target_ratio: { type: number, nullable: true, description: 目标厂商分组倍率（3 位小数；固定模式无草稿时是 NewAPI 的原值）。NewAPI 里的倍率与它相差不到半个写入步长（5e-4）即视为已同步，所以不是 3 位小数的现有倍率（如 0.2857）也是已同步 }
        newapi_ratio: { type: number, nullable: true, description: NewAPI 里该分组当前的倍率；null = NewAPI 里还没有这个分组 }
        draft_ratio: { type: number, nullable: true, description: 固定模式下还没写入 NewAPI 的草稿倍率；没有草稿（或草稿已等于 NewAPI 当前值）为 null }
        change: { type: number, nullable: true, description: '(目标售价 − NewAPI 当前售价) ÷ NewAPI 当前售价，带方向；NewAPI 没有该分组或算不出为 null' }
        small_change: { type: boolean, description: 跟随模式下 |change| 小于最小变动；定时任务不写，手动写入仍包含 }
        state:
          type: string
          enum: [synced, to_write, pending, no_channel, unset]
          description: |
            固定模式：unset（没有草稿且 NewAPI 没有该分组）→ to_write（有草稿且与 NewAPI 当前值相差 ≥ 5e-4）→ synced。
            跟随模式：unset（没有加价比例或售价过小）→ no_channel（没有参考成本）→ pending（|change| > 变化保护阈值）→ to_write（目标倍率与 NewAPI 当前值相差 ≥ 5e-4，含被手改的）→ synced。
        revenue_7d: { type: number }
        cost_7d: { type: number }
        margin_7d: { type: number, nullable: true, description: (收入 − 成本) ÷ 收入；没有收入时为 null }
    VendorPricingOverview:
      type: object
      properties:
        site_rate: { type: number }
        usd_rate: { type: number }
        auto_write: { type: boolean }
        protect_threshold: { type: number }
        min_change: { type: number }
        items: { type: array, items: { $ref: '#/components/schemas/VendorPricingItem' } }
        groups:
          type: object
          description: AutoGroups（厂商分组在前，其它项保持原顺序）和 UserUsableGroups（补厂商分组和 auto，已有项不动）与目标的差异
          properties:
            auto_groups: { type: object, properties: { current: { type: array, items: { type: string } }, target: { type: array, items: { type: string } } } }
            user_usable_groups: { type: object, properties: { current: { type: object, additionalProperties: { type: string } }, target: { type: object, additionalProperties: { type: string } } } }
            changed: { type: boolean }
        error: { type: string, description: 非空 = NewAPI 选项读取或解析失败（或站点汇率无效），此时不能写入也不能编辑 }
    VendorPricingApplyInput:
      type: object
      description: 服务端重新计算，不信任客户端的数值
      properties:
        vendor_ids: { type: array, items: { type: integer }, description: 省略 = 所有待写入厂商（含 small_change）；给出（含空数组）= 恰好这些厂商。待确认、未设置、无可用渠道一律跳过 }
        include_groups: { type: boolean, default: true, description: 同时写 UserUsableGroups 和 AutoGroups（只写有变化的） }
    VendorPricingPlan:
      type: object
      description: preview 与 apply 的响应。preview 含 options；apply 含 written。
      properties:
        written: { type: array, items: { type: string, enum: [GroupRatio, UserUsableGroups, AutoGroups] }, description: 仅 apply：实际写入的选项（写入顺序） }
        vendors:
          type: array
          items: { type: object, properties: { vendor_id: { type: integer }, vendor: { type: string }, group: { type: string }, before_price: { type: number, nullable: true }, after_price: { type: number, nullable: true }, before_ratio: { type: number, nullable: true }, after_ratio: { type: number, nullable: true } } }
        skipped:
          type: array
          items: { type: object, properties: { vendor_id: { type: integer }, vendor: { type: string }, state: { type: string }, reason: { type: string } } }
        options:
          type: array
          description: 仅 preview：会变化的选项，JSON 字符串
          items: { type: object, properties: { key: { type: string }, before: { type: string }, after: { type: string } } }
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        at: { type: integer }
        kind: { type: string, enum: [channel, price, setting, upstream] }
        target: { type: string }
        action: { type: string }
        summary: { type: string }
        before: { type: string }
        after: { type: string }
        request: { type: string }
        response: { type: string }
        trigger: { type: string, enum: [auto, manual] }
        result: { type: string, enum: [ok, fail, skipped] }
        error: { type: string }
        operator: { type: string }
        rollback_of: { type: integer, nullable: true }
    Token:
      type: object
      description: 上游令牌。<u>永远不返回 key</u>，只返回 key_hint（前 5 位…后 4 位）。
      properties:
        id: { type: integer }
        upstream_id: { type: integer }
        remote_id: { type: string, description: 上游上的令牌 id；手动录入为空 }
        name: { type: string }
        group: { type: string }
        key_hint: { type: string }
        quota_usd: { type: number, nullable: true }
        unlimited: { type: boolean }
        status: { type: integer, description: 1 启用；0 = 上游已删除但仍有渠道在用 }
        manual: { type: boolean }
        updated_at: { type: integer }
    UpstreamGroup:
      type: object
      properties:
        id: { type: integer }
        upstream_id: { type: integer }
        name: { type: string }
        ratio: { type: number }
        desc: { type: string }
        updated_at: { type: integer }
    UpstreamModelPrice:
      type: object
      properties:
        id: { type: integer }
        upstream_id: { type: integer }
        group: { type: string }
        model: { type: string }
        model_ratio: { type: number, nullable: true }
        input: { type: number, nullable: true, description: 上游美元 / 百万 token }
        output: { type: number, nullable: true }
        cache_read: { type: number, nullable: true }
        cache_write: { type: number, nullable: true }
        per_request: { type: number, nullable: true }
        updated_at: { type: integer }
    ProbeResponse:
      type: object
      properties:
        adapter: { type: string, description: 识别出站点的适配器（先试 newapi，再试 generic） }
        type: { type: string }
        evidence: { type: string }
        version: { type: string }
        login_captcha: { type: boolean, description: 站点登录需要人机验证（Turnstile），账号密码无法登录 }
    CheckResult:
      type: object
      description: 添加上游向导的连通性检查。
      properties:
        name: { type: string, enum: [站点可达, 凭证有效, 令牌列表, 分组倍率, 公告] }
        ok: { type: boolean }
        skipped: { type: boolean, description: 该上游类型不支持这项 }
        message: { type: string }
        ms: { type: integer }
    SyncResult:
      type: object
      properties:
        what: { type: string, enum: [tokens, groups, balance] }
        ok: { type: boolean }
        count: { type: integer }
        error: { type: string }
    VendorInput:
      type: object
      properties:
        name: { type: string, maxLength: 64 }
        group_name: { type: string, maxLength: 64, pattern: '^[a-zA-Z0-9_-]+$', description: 对应 NewAPI 分组（varchar(64)） }
        models: { type: array, items: { type: string }, description: 一个模型只能属于一个厂商 }
        pattern: { type: string, description: 可选正则 }
        channel_type: { type: integer, enum: [58, 24], default: 58 }
    Vendor:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        group_name: { type: string }
        models: { type: string, description: JSON 数组字符串 }
        model_list: { type: array, items: { type: string } }
        pattern: { type: string }
        order: { type: integer }
        channel_type: { type: integer }
        channel_count: { type: integer }
    Fields:
      type: object
      description: 草稿可改的 NewAPI 渠道字段；未出现 = 不改。key 不在其中，应用时由令牌解析。
      properties:
        name: { type: string }
        base_url: { type: string }
        models: { type: array, items: { type: string } }
        group: { type: string }
        priority: { type: integer }
        weight: { type: integer, minimum: 0 }
        tag: { type: string }
        status: { type: integer, enum: [1, 2, 3] }
        test_model: { type: string }
        type: { type: integer, description: 仅新建时有效 }
    ExtFields:
      type: object
      description: 只存 nam 的字段，不写 NewAPI。
      properties:
        upstream_id: { type: integer }
        token_id: { type: integer }
        vendor: { type: string, description: '只在提交时有效：转成换分组的草稿，不存进草稿 / ext；渠道的厂商由分组推出' }
        discount: { type: number, exclusiveMinimum: true, minimum: 0, description: 设为手填的上游分组倍率 }
        discount_source: { type: string, enum: [auto], description: '"auto" 且不带 discount = 清掉手填，回到自动' }
    Change:
      type: object
      required: [channel_id]
      properties:
        channel_id: { type: integer, description: ">0 现有渠道；<0 尚未创建的草稿" }
        fields: { $ref: '#/components/schemas/Fields' }
        ext: { $ref: '#/components/schemas/ExtFields' }
    ValidationIssue:
      type: object
      properties:
        channel_id: { type: integer }
        name: { type: string }
        field: { type: string }
        message: { type: string }
    Row:
      type: object
      description: 渠道表一行：NewAPI 值叠加未应用的草稿值。
      properties:
        id: { type: integer }
        type: { type: integer }
        name: { type: string }
        status: { type: integer }
        base_url: { type: string }
        models: { type: array, items: { type: string } }
        group: { type: string }
        priority: { type: integer }
        weight: { type: integer }
        tag: { type: string }
        test_model: { type: string }
        response_time: { type: integer }
        test_time: { type: integer }
        used_quota: { type: integer }
        managed: { type: boolean }
        upstream_id: { type: integer, nullable: true }
        upstream_name: { type: string }
        token_id: { type: integer, nullable: true }
        token_name: { type: string }
        vendor: { type: string, description: 渠道分组（草稿叠加后）里按厂商顺序第一个属于厂商的分组对应的厂商；没有为空 }
        discount: { type: number, nullable: true, description: '渠道级上游分组倍率；discount_source 为 none 时为 null' }
        discount_source: { type: string, enum: [manual, auto, group, none], description: 'manual 手填；auto 渠道各模型 上游价 ÷ 原厂价 的中位数；group 令牌所在分组的上游分组倍率；none 算不出' }
        discount_reason: { type: string, description: 'none 时说明原因（未关联上游 / 未关联令牌 / 令牌没有分组 / 上游没有这个分组的价格和倍率），其它为空' }
        upstream_group_ratio: { type: number, nullable: true, description: 令牌所在分组的上游分组倍率（≤ 0 或没有为 null） }
        currency_rate: { type: number, nullable: true }
        channel_cost: { type: number, nullable: true, description: 上游渠道售价 = 分组倍率 × 上游货币汇率 ÷ usd_cny_rate，原厂价的倍数，无单位；没有汇率或倍率为 null 时为 null }
        balance_usd: { type: number, nullable: true, description: 上游余额（美元） }
        balance_cny: { type: number, nullable: true, description: 上游余额折合人民币（× 上游货币汇率） }
        unit_cost: { type: number, nullable: true, description: '单次成本（元）：标准请求 1000 输入（200 缓存）+ 500 输出；缺价或倍率为 null 时为空' }
        unit_cost_model: { type: string, description: 计算单次成本所用模型（测试模型，缺价则取最便宜的有价模型） }
        sync_state: { type: string, enum: [synced, draft, draft_create, draft_delete, error] }
        dirty_fields: { type: array, items: { type: string } }
        draft_id: { type: integer }
        draft_op: { type: string, enum: [create, update, delete] }
        draft_error: { type: string }
    FieldChange:
      type: object
      properties:
        field: { type: string }
        old: {}
        new: {}
        newapi: { type: boolean, description: false = 只改 nam，不写 NewAPI }
    PlanItem:
      type: object
      properties:
        draft_id: { type: integer }
        channel_id: { type: integer }
        op: { type: string, enum: [create, update, delete] }
        name: { type: string }
        changes: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
        request:
          type: object
          nullable: true
          description: 将发给 NewAPI 的请求；只改 nam 字段时为空。创建时 key 不展示。
          properties:
            method: { type: string }
            path: { type: string }
            body: {}
    Result:
      type: object
      properties:
        draft_id: { type: integer }
        channel_id: { type: integer, description: 创建成功后为新 id }
        op: { type: string }
        name: { type: string }
        ok: { type: boolean }
        error: { type: string }
    CreateSpec:
      type: object
      properties:
        fields: { $ref: '#/components/schemas/Fields' }
        ext: { $ref: '#/components/schemas/ExtFields' }
    BatchRequest:
      type: object
      required: [upstream_id, token_ids]
      description: 批量创建向导：一个上游、若干令牌；每个令牌的模型按厂商拆分，每个（令牌 × 厂商）一个渠道。
      properties:
        upstream_id: { type: integer }
        token_ids: { type: array, items: { type: integer } }
        token_models: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 令牌 id（字符串）→ 模型列表；缺省或为空时用该令牌保存的 models，两者都空则 400 并点名该令牌 }
        priority: { type: integer }
        weight: { type: integer }
        tag: { type: string }
        test_model: { type: object, additionalProperties: { type: string }, description: 厂商名 → 测试模型 }
        discount: { type: object, additionalProperties: { type: number }, description: 令牌 id → 手填的上游分组倍率；留空 = 自动（现算） }
    BatchPreviewItem:
      allOf:
        - { $ref: '#/components/schemas/CreateSpec' }
        - type: object
          properties:
            name: { type: string }
            token_name: { type: string }
            vendor: { type: string }
            group: { type: string }
            channel_type: { type: integer }
            duplicate: { type: boolean, description: 名称已存在于 NewAPI 或草稿 }
            discount: { type: number, nullable: true, description: 预览算出的渠道级倍率；null = 无法推算 }
            discount_source: { type: string, enum: [manual, auto, group, none] }
            discount_reason: { type: string }
    BatchPreview:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BatchPreviewItem' } }
        warnings: { type: array, items: { type: string }, description: 例如“令牌 X 的模型属于 2 个厂商，将拆成 2 个渠道” }
        unassigned: { type: array, items: { type: string }, description: 没有厂商的模型（各令牌的并集，已排序）；这些模型被跳过 }
        unassigned_by_token: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 令牌 id（字符串）→ 该令牌没有厂商的模型 }
    MatchTokenItem:
      type: object
      properties:
        channel_id: { type: integer }
        token_id: { type: integer, nullable: true, description: needs_manual 时为 null }
        token_name: { type: string }
        created: { type: boolean, description: 没有匹配到已有令牌，已新建手动令牌 }
        needs_manual: { type: boolean, description: 拿不到 key 或是多 key 渠道，需手动选择令牌 }
        message: { type: string }
    OfficialPrice:
      type: object
      description: 解析后的原厂价（美元 / 百万 token，或美元 / 次）。手动覆盖优先于价格库。
      properties:
        model: { type: string, description: 价格库里的名字（别名映射后） }
        input: { type: number, nullable: true }
        output: { type: number, nullable: true }
        cache_read: { type: number, nullable: true }
        cache_write_5m: { type: number, nullable: true }
        cache_write_1h: { type: number, nullable: true }
        per_request: { type: number, nullable: true }
        source: { type: string, description: 价格库来源（litellm / manual）或 override }
    NewAPIPrice:
      type: object
      description: NewAPI 当前生效的模型价格，由选项 ModelRatio（×2）、CompletionRatio、CacheRatio、CreateCacheRatio、ModelPrice 换算。
      properties:
        input: { type: number, nullable: true, description: ModelRatio × 2（美元 / 百万 token） }
        output: { type: number, nullable: true, description: 输入 × CompletionRatio；选项里没有时为空 }
        cache_read: { type: number, nullable: true, description: 输入 × CacheRatio；选项里没有时为空 }
        cache_write: { type: number, nullable: true }
        per_request: { type: number, nullable: true }
        unknown: { type: array, items: { type: string, enum: [output, cache_read] }, description: 选项里没有的字段，界面标为「未知」，不参与偏差比较（NewAPI 对部分模型有内置默认值，见 M0 ④） }
    PriceRow:
      type: object
      properties:
        model: { type: string }
        vendor: { type: string }
        aliases: { type: array, items: { type: string } }
        official: { allOf: [{ $ref: '#/components/schemas/OfficialPrice' }], nullable: true, description: 空 = 缺价 }
        source: { type: string }
        newapi: { allOf: [{ $ref: '#/components/schemas/NewAPIPrice' }], nullable: true, description: 空 = NewAPI 没有配置该模型 }
        deviation:
          type: object
          nullable: true
          description: NewAPI 相对原厂价的偏差（小数，0.05 = +5%），按字段比较；无法比较的字段为空
          properties:
            input: { type: number, nullable: true }
            output: { type: number, nullable: true }
            cache_read: { type: number, nullable: true }
            per_request: { type: number, nullable: true }
        channel_count: { type: integer }
        status: { type: string, enum: [normal, deviation, no_price, per_request] }
    PriceOverrideInput:
      type: object
      properties:
        per_request_mode: { type: boolean }
        input: { type: number, nullable: true, description: 按 token 计费时必填，> 0 }
        output: { type: number, nullable: true }
        cache_read: { type: number, nullable: true }
        cache_write_5m: { type: number, nullable: true }
        cache_write_1h: { type: number, nullable: true }
        per_request: { type: number, nullable: true, description: 按次计费时必填，> 0 }
        remark: { type: string }
    ChannelModelRow:
      type: object
      properties:
        model: { type: string }
        official: { type: string }
        price: { allOf: [{ $ref: '#/components/schemas/OfficialPrice' }], nullable: true }
        upstream_input: { type: number, nullable: true }
        derived: { type: number, nullable: true, description: 这个模型自己的 上游价 ÷ 原厂价（按次计费用按次价相除；模型名先找原名再找别名） }
        deviation: { type: number, nullable: true, description: 相对基准的偏离；基准 = 上游分组倍率（有的话），否则渠道中位数 }
        deviates: { type: boolean, description: '偏离 > 1%：上游给这个模型的标价和原厂价不一致' }
        reason: { type: string, description: derived 为 null 的原因 }
        override: { type: number, nullable: true, description: 模型级倍率覆盖 }
        effective: { type: number, nullable: true, description: 这个模型实际使用的倍率；null = 算不出，成本字段为 null }
        effective_source: { type: string, enum: [override, manual, model, channel, none], description: 'override 模型级覆盖；manual 渠道手填；model 模型自己的上游价 ÷ 原厂价；channel 渠道级 auto / group；none 算不出' }
        cost_in_per_m: { type: number, nullable: true }
        cost_out_per_m: { type: number, nullable: true }
        cost_per_request: { type: number, nullable: true }
    StatsMetrics:
      type: object
      description: 统计指标。比率都是 0–1 的小数，可空字段无数据时为 null。
      properties:
        requests: { type: integer }
        success: { type: integer }
        fail: { type: integer }
        success_rate: { type: number, nullable: true }
        wilson: { type: number, nullable: true, description: 成功率的 Wilson 下界（z = 1.96） }
        fail_by_class: { type: object, additionalProperties: { type: integer }, description: '键 timeout / 429 / 401 / balance / 5xx / other' }
        frt_p50: { type: number, nullable: true, description: 首字延迟毫秒 }
        frt_p95: { type: number, nullable: true }
        speed_p50: { type: number, nullable: true, description: 吐字速度 token/秒 }
        speed_p95: { type: number, nullable: true }
        speed_estimated: { type: boolean, description: true = NewAPI 未打补丁 P1，按整秒估算 }
        cache_hit: { type: number, nullable: true }
        prompt_tokens: { type: integer, description: 非缓存输入 token }
        completion_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        cost_cny: { type: number }
        revenue_cny: { type: number }
        priced_requests: { type: integer }
        effective_cost_price: { type: number, nullable: true, description: 实际花费是原厂价（不算缓存）的多少倍，无单位（前端显示为百分比）= 成本 ÷ 不算缓存的原厂成本 ÷ usd_cny_rate }
        measured_cost_price: { type: number, nullable: true, description: 实际花费是原厂价（按原厂缓存价）的多少倍，无单位 = 成本 ÷ 按原厂缓存价算的原厂成本 ÷ usd_cny_rate }
        margin: { type: number, nullable: true }
    StatsChannelItem:
      allOf:
        - { $ref: '#/components/schemas/StatsMetrics' }
        - type: object
          properties:
            channel_id: { type: integer }
            std_cost_price: { type: number, nullable: true, description: 标准用量下渠道成本是原厂价的多少倍（无单位）÷ usd_cny_rate；价格档按它排序（除以同一个正数不改变排序） }
            price_tier: { type: string, nullable: true, enum: [cheap, mid, expensive] }
            quality_tier: { type: string, enum: [good, mid, bad, insufficient], description: 请求数 < 20 为 insufficient }
    StatsChannelList:
      type: object
      properties:
        window: { type: string, description: 'latest，或 <N>h / <N>d 形式的时长（如 12h、3d、30d）' }
        model: { type: string, description: 请求的模型（去掉首尾空白）；为空 = 渠道总计 }
        generated_at: { type: integer }
        patch_p1: { type: boolean }
        error_log_hint: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/StatsChannelItem' } }
    ModelCost:
      type: object
      properties:
        channel_id: { type: integer }
        has_model: { type: boolean, description: 渠道的模型列表是否含该模型；false 时下面的数字都为 null }
        discount: { type: number, nullable: true, description: 该模型实际使用的倍率（override → manual → model → channel）；null = 算不出，成本字段也为 null }
        discount_source: { type: string, enum: [override, manual, model, channel, none] }
        channel_cost: { type: number, nullable: true, description: 上游渠道售价 = 分组倍率 × 上游货币汇率 ÷ usd_cny_rate，原厂价的倍数，无单位 }
        unit_cost: { type: number, nullable: true, description: 该模型一次标准请求的成本（元）；没有汇率或价格库没有该模型时为 null }
    ModelCostList:
      type: object
      properties:
        model: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ModelCost' } }
    UiLayoutResponse:
      type: object
      properties:
        layout: { type: object, nullable: true, additionalProperties: true }
        saved_at: { type: integer, description: Unix 秒；0 = 从未保存 }
    StatsModelItem:
      allOf:
        - { $ref: '#/components/schemas/StatsMetrics' }
        - type: object
          properties:
            model: { type: string }
    StatsRow:
      allOf:
        - { $ref: '#/components/schemas/StatsMetrics' }
        - type: object
          properties:
            key: { type: string, description: '渠道/上游为 id 字符串（未纳管上游为 ""）；模型为模型名；厂商为厂商名（未归属为 ""）' }
            name: { type: string }
    StatsScatterPoint:
      type: object
      properties:
        channel_id: { type: integer }
        name: { type: string }
        vendor: { type: string }
        std_cost_price: { type: number, nullable: true, description: 同 StatsChannelItem.std_cost_price（原厂价的倍数，无单位） }
        wilson: { type: number, nullable: true }
        requests: { type: integer }
    StatsOverview:
      type: object
      properties:
        from: { type: integer }
        to: { type: integer }
        dim: { type: string, enum: [channel, model, upstream, vendor] }
        patch_p1: { type: boolean }
        error_log_hint: { type: boolean }
        totals: { $ref: '#/components/schemas/StatsMetrics' }
        rows: { type: array, items: { $ref: '#/components/schemas/StatsRow' } }
        error_classes: { type: object, additionalProperties: { type: integer } }
        scatter: { type: array, items: { $ref: '#/components/schemas/StatsScatterPoint' } }
    StatsSeriesPoint:
      allOf:
        - { $ref: '#/components/schemas/StatsMetrics' }
        - type: object
          properties:
            t: { type: integer, description: 桶起点 Unix 秒（day 为本地自然日 0 点） }
    StatsSeries:
      type: object
      properties:
        bucket: { type: string, enum: [hour, day] }
        points: { type: array, items: { $ref: '#/components/schemas/StatsSeriesPoint' } }
    StatsStatus:
      type: object
      properties:
        cursor_id: { type: integer }
        cursor_at: { type: integer }
        rows: { type: integer }
        oldest_hour: { type: integer, nullable: true }
        backfill_days: { type: integer }
        patch_p1: { type: boolean }
        error_log_hint: { type: boolean }
        last_pull_at: { type: integer }
        last_pull_message: { type: string }
paths:
  /ping:
    get:
      summary: 健康检查（无需登录）
      responses: { '200': { description: data = "pong" } }
  /auth/login:
    post:
      summary: 登录（仅独立模式）
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        '200': { description: 设置 nam_session cookie（7 天） }
        '401': { description: '密码错误；data = {failures, locked_until}' }
        '429': { description: '连续失败 5 次后锁定 60 秒；data = {locked_until}' }
  /auth/logout:
    post:
      summary: 退出（仅独立模式）
      responses: { '200': { description: ok } }
  /auth/password:
    post:
      summary: 修改管理员密码（仅独立模式）；成功后所有会话失效
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password, confirm_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
                confirm_password: { type: string }
      responses: { '200': { description: ok }, '400': { description: 校验失败 }, '401': { description: 旧密码错误 } }
  /session:
    get:
      summary: 当前模式与身份
      responses: { '200': { description: data = Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } } }
  /backend:
    get:
      summary: NewAPI 连接状态
      responses: { '200': { description: data = BackendInfo } }
  /upstreams:
    get:
      summary: 上游列表
      responses: { '200': { description: 'data = Upstream[]' } }
    post:
      summary: 新增上游（只写 nam）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UpstreamInput' } } } }
      responses: { '200': { description: data = Upstream }, '400': { description: 校验失败 }, '409': { description: 名称重复 } }
  /upstreams/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      responses: { '200': { description: data = Upstream }, '404': { description: 不存在 } }
    put:
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UpstreamInput' } } } }
      responses: { '200': { description: data = Upstream } }
    delete:
      summary: 删除上游；其渠道的删除加入草稿（新建草稿直接丢弃），需在草稿里应用才会真正删除 NewAPI 渠道
      responses: { '200': { description: 'data = {deleted_channels}' } }
  /upstreams/probe:
    post:
      summary: 自动识别站点类型（先试 newapi，再试 generic，不需要凭证）
      requestBody: { content: { application/json: { schema: { type: object, required: [base_url], properties: { base_url: { type: string } } } } } }
      responses: { '200': { description: data = ProbeResponse }, '400': { description: 地址不合法 }, '502': { description: 两种适配器都无法识别，message 列出原因 } }
  /upstreams/test:
    post:
      summary: 连通性检查（向导用，不保存）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UpstreamInput' } } } }
      responses: { '200': { description: 'data = CheckResult[]（5 项）' }, '400': { description: 校验失败（含 generic 的 adapter_config） } }
  /upstreams/{id}/test:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 对已保存的上游做连通性检查
      responses: { '200': { description: 'data = CheckResult[]' }, '404': { description: 不存在 } }
  /upstreams/{id}/sync:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 同步令牌 / 分组倍率与模型价格 / 余额；上游不支持的项视为成功（无操作）
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { what: { type: array, items: { type: string, enum: [tokens, groups, balance] }, description: 默认三项全做 } } }
      responses: { '200': { description: 'data = SyncResult[]；单项失败不影响其他项' }, '404': { description: 不存在 } }
  /upstreams/{id}/tokens:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: 令牌列表（不含 key）；每个令牌带 models（本站模型列表，无则 []）
      responses: { '200': { description: 'data = Token[]（含 models: string[]）' } }
    post:
      summary: 手动录入令牌（key 加密保存）
      requestBody: { content: { application/json: { schema: { type: object, required: [name, key], properties: { name: { type: string }, group: { type: string }, key: { type: string } } } } } }
      responses: { '200': { description: data = Token }, '400': { description: 校验失败 } }
  /upstreams/{id}/tokens/remote:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 在上游站点上创建令牌并保存（写入上游，记审计）
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, group: { type: string }, quota_usd: { type: number, nullable: true, description: 空 = 不限额 } } } } } }
      responses: { '200': { description: data = Token }, '400': { description: 校验失败或该类型不支持 }, '502': { description: 上游报错 } }
  /upstreams/{id}/tokens/{tid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: tid, in: path, required: true, schema: { type: integer } }
    delete:
      summary: 删除令牌（只删 nam 的记录）；被渠道使用时拒绝
      responses: { '200': { description: ok }, '404': { description: 不存在 }, '409': { description: 仍被渠道使用 } }
  /upstreams/{id}/tokens/{tid}/models:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: tid, in: path, required: true, schema: { type: integer } }
    put:
      summary: 保存令牌的本站模型列表（去空格、去空项、去重并保持顺序）；只写 nam，记审计
      requestBody: { content: { application/json: { schema: { type: object, required: [models], properties: { models: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: data = Token }, '404': { description: 令牌不在该上游 } }
  /upstreams/{id}/groups:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: 上游分组倍率（同步结果）
      responses: { '200': { description: 'data = UpstreamGroup[]' } }
  /upstreams/{id}/models:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: 上游模型价格（同步结果）
      responses: { '200': { description: 'data = UpstreamModelPrice[]' } }
  /upstreams/{id}/models/fetch:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 用某个令牌的 key 调上游 /v1/models，返回模型 id
      requestBody: { content: { application/json: { schema: { type: object, required: [token_id], properties: { token_id: { type: integer }, channel_type: { type: integer, default: 58, description: 可选；NewAPI 渠道类型，影响拉取方式（24 = Gemini） } } } } } }
      responses: { '200': { description: 'data = {models: string[]}' }, '404': { description: 令牌不存在 }, '502': { description: 上游报错 } }
  /vendors:
    get:
      summary: 厂商列表（按 AutoGroups 顺序）
      responses: { '200': { description: 'data = Vendor[]' } }
    post:
      summary: 新增厂商。只写 nam；NewAPI 的 GroupRatio / AutoGroups / UserUsableGroups 由 POST /vendor-pricing/apply 写入
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VendorInput' } } } }
      responses: { '200': { description: data = Vendor }, '400': { description: 校验失败 }, '409': { description: 名称或分组重复，或模型已属于另一个厂商（message 同时写出两个厂商名） } }
  /vendors/order:
    put:
      summary: 调整顺序（必须包含全部厂商）
      requestBody: { content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: integer } } } } } } }
      responses: { '200': { description: ok }, '400': { description: ids 不完整或重复 } }
  /vendors/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      summary: 修改厂商；仍有渠道使用时不能改名称和分组
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VendorInput' } } } }
      responses: { '200': { description: data = Vendor }, '400': { description: 校验失败 }, '404': { description: 不存在 }, '409': { description: 冲突 } }
    delete:
      summary: 删除厂商；仍有渠道使用时拒绝
      responses: { '200': { description: ok }, '404': { description: 不存在 }, '409': { description: 仍有渠道使用 } }
  /vendor-pricing:
    get:
      summary: 厂商定价总览。只读，不写 nam.db：没有定价行的厂商视为固定模式、无草稿，目标倍率读 NewAPI 当前的 GroupRatio（没有则 unset）
      responses: { '200': { description: data = VendorPricingOverview } }
  /vendor-pricing/preview:
    post:
      summary: 预览写入：只计算，不写 NewAPI
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VendorPricingApplyInput' } } } }
      responses: { '200': { description: data = VendorPricingPlan（vendors、skipped、options） }, '409': { description: NewAPI 选项解析失败或站点汇率无效，不能写入 } }
  /vendor-pricing/apply:
    post:
      summary: |
        写入 NewAPI。流程：读三个选项并解析（任一非法 JSON 则报错且不写）→ 计算并校验倍率有限且 > 0 → 只写有变化的选项（GroupRatio → UserUsableGroups → AutoGroups，只改厂商分组键）→ 读回按解析值核对 → 每个改了倍率的厂商记一条 price_history，写完的固定模式厂商清掉 draft_ratio。写入串行化（与定价任务互斥）。
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VendorPricingApplyInput' } } } }
      responses: { '200': { description: data = VendorPricingPlan（written、vendors、skipped） }, '409': { description: NewAPI 选项解析失败或站点汇率无效，不能写入 }, '502': { description: 写入或读回核对失败；message 说明在哪一步 } }
  /vendor-pricing/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      summary: |
        修改模式、加价比例，或（固定模式）存草稿倍率（缺省字段不改）。只写 nam，不写 NewAPI；写入要走 preview / apply。
        固定模式下 sell_price 换算成 3 位倍率（售价 × 美元参考汇率 ÷ 站点汇率）、group_ratio 取整 3 位，存为 draft_ratio；与 NewAPI 当前值相差 < 5e-4 时清掉草稿。
        group_ratio 折合的售价仍要满足 0 < x ≤ 10。sell_price / group_ratio 只在固定模式下允许（请求里 mode 为 fixed，或厂商当前是固定模式且请求没改 mode），不能同时给。
        discard_draft: true 清掉草稿，不能和其它字段同时给。改成跟随模式会清掉草稿。
      requestBody: { content: { application/json: { schema: { type: object, properties: { mode: { type: string, enum: [fixed, follow] }, sell_price: { type: number, description: 0 < x ≤ 10；只在固定模式下可用 }, markup: { type: number, description: 0 < x ≤ 100 }, group_ratio: { type: number, description: 厂商分组倍率；舍入到 3 位后必须 > 0；只在固定模式下可用，不能和 sell_price 同时给 }, discard_draft: { type: boolean, description: true = 清掉固定模式的草稿倍率（撤销修改） } } } } } }
      responses: { '200': { description: data = VendorPricingItem }, '400': { description: 校验失败（含：跟随模式给了 sell_price 或 group_ratio、同时给了 group_ratio 和 sell_price、discard_draft 和其它字段同时给、倍率舍入后 ≤ 0、售价舍入出的倍率为 0） }, '404': { description: 厂商不存在 }, '409': { description: NewAPI 选项或站点汇率异常，暂时不能编辑 } }
  /vendor-pricing/{id}/confirm:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 确认写入待确认厂商当前的目标值（只对 pending 状态）
      responses: { '200': { description: data = VendorPricingPlan（written、vendors、skipped） }, '404': { description: 厂商不存在 }, '409': { description: 不是待确认状态，或 NewAPI 选项异常 }, '502': { description: 写入或读回核对失败 } }
  /channels:
    get:
      summary: 渠道表（NewAPI 渠道 + 待创建草稿，叠加未应用的草稿值）
      responses: { '200': { description: 'data = {items: Row[], draft_count}' } }
  /channels/drafts:
    patch:
      summary: 保存编辑为草稿；先校验整套渠道，不通过则一条都不保存
      requestBody: { content: { application/json: { schema: { type: object, required: [changes], properties: { changes: { type: array, items: { $ref: '#/components/schemas/Change' } } } } } } }
      responses:
        '200': { description: 'data = {issues: []}' }
        '400': { description: 'data = {issues: ValidationIssue[]}（校验失败）；或请求本身不合法（无 data）' }
    delete:
      summary: 丢弃草稿
      requestBody: { content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: integer } } } } } } }
      responses: { '200': { description: 省略 ids = 丢弃全部草稿 } }
  /channels/batch/preview:
    post:
      summary: 批量创建预览（不写任何东西）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BatchRequest' } } } }
      responses:
        '200': { description: 'data = BatchPreview（没有厂商的模型被跳过，见 unassigned / unassigned_by_token）', content: { application/json: { schema: { $ref: '#/components/schemas/BatchPreview' } } } }
        '400': { description: 某个令牌没有模型（请求和令牌保存的都为空），或令牌不属于该上游 }
  /channels/match-tokens:
    post:
      summary: 接管已有渠道：按渠道 key 匹配该上游的令牌；匹配不到则新建手动令牌（只写 nam.db，不写 NewAPI，不建草稿）
      requestBody: { content: { application/json: { schema: { type: object, required: [upstream_id, channel_ids], properties: { upstream_id: { type: integer }, channel_ids: { type: array, items: { type: integer } } } } } } }
      responses:
        '200': { description: 'data = {items: MatchTokenItem[]}', content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MatchTokenItem' } } } } } } }
        '400': { description: 参数不合法 }
        '404': { description: 上游不存在 }
  /channels/batch:
    post:
      summary: 批量创建渠道草稿（需再「应用」才会写 NewAPI）
      requestBody:
        content:
          application/json:
            schema:
              description: 传 BatchRequest 由服务端展开，或传 specs 直接提交预览（可编辑后的）条目
              allOf:
                - { $ref: '#/components/schemas/BatchRequest' }
                - { type: object, properties: { specs: { type: array, items: { $ref: '#/components/schemas/CreateSpec' } } } }
      responses:
        '200': { description: 'data = {ids: int[]}（负数临时 id）' }
        '400': { description: 'data = {issues: ValidationIssue[]}，或没有可创建的渠道' }
  /channels/delete:
    post:
      summary: 标记删除（现有渠道进入删除草稿；新建草稿直接丢弃）
      requestBody: { content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: integer } } } } } } }
      responses: { '200': { description: ok } }
  /channels/plan:
    get:
      summary: 应用预览
      parameters: [{ name: ids, in: query, schema: { type: string }, description: 逗号分隔的渠道 id；省略 = 全部草稿 }]
      responses: { '200': { description: 'data = PlanItem[]（先删除，再更新，最后创建）' } }
  /channels/issues:
    get:
      summary: 规则检查：对所有渠道（含草稿叠加）跑校验规则（名称、模型属于别的厂商、模型同时在多个厂商分组、渠道在多个厂商分组、手填倍率 ≤ 0）
      responses: { '200': { description: 'data = {items: ValidationIssue[]}（没有问题时 items 为空数组）' } }
  /channels/costs:
    get:
      summary: 每个渠道在指定模型上的折扣与成本（行集合与 GET /channels 相同，含负数 id 的草稿新建渠道）
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 }, description: 去掉首尾空白后不能为空 }
      responses:
        '200': { description: 'data = ModelCostList' }
        '400': { description: model 为空或超过 200 个字符 }
  /channels/apply:
    post:
      summary: 应用草稿，逐条写 NewAPI（全部经审计）；失败的草稿保留并带错误
      requestBody: { content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: integer } } } } } } }
      responses:
        '200': { description: 'data = {results: Result[], success, failed}' }
        '400': { description: 'data = {issues: ValidationIssue[]}，校验失败时一条都不写' }
  /channels/{id}/adopt:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 纳入管理现有 NewAPI 渠道（只建 nam 的扩展行，不存快照，不写 NewAPI）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ExtFields' } } } }
      responses: { '200': { description: ok }, '404': { description: 渠道不存在 } }
  /channels/{id}/test:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 调用 NewAPI 的渠道测试
      requestBody: { content: { application/json: { schema: { type: object, properties: { model: { type: string } } } } } }
      responses: { '200': { description: 'data = {success, message, duration}' }, '502': { description: NewAPI 报错 } }
  /channels/{id}/newapi-link:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: NewAPI 渠道页链接。嵌入模式返回同源路径，独立模式返回 NewAPI 地址 + 路径
      responses: { '200': { description: 'data = {url}，路径为 /console/channel?id=<id>' } }
  /channels/{id}/models:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: 渠道的模型明细（原厂价、上游价、倍率及来源、偏离、成本）
      responses: { '200': { description: 'data = {channel_id, name, vendor, discount, discount_source, discount_reason, upstream_group_ratio, derived_median, currency_rate, test_model, models: ChannelModelRow[]}' }, '404': { description: 渠道不存在 } }
  /channels/{id}/model-discount:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      summary: 设置或清除模型级上游分组折扣（只写 nam.db，记审计 channel/model_discount）
      requestBody: { content: { application/json: { schema: { type: object, required: [model], properties: { model: { type: string }, discount: { type: number, nullable: true, description: 必须 > 0；null = 清除 } } } } } }
      responses: { '200': { description: 'data = {模型: 折扣}（更新后的全部覆盖）' }, '400': { description: 折扣不合法，或渠道未被 nam 管理 } }
  /channels/{id}/cache-override:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      summary: 设置或清除渠道缓存价覆盖（占输入价的比例；只写 nam.db，记审计 channel/cache_override）
      requestBody: { content: { application/json: { schema: { type: object, properties: { read: { type: number, nullable: true, minimum: 0 }, write: { type: number, nullable: true, minimum: 0 } }, description: 两项都为空 = 清除 } } } }
      responses: { '200': { description: 'data = {read?, write?}' }, '400': { description: 比例不合法，或渠道未被 nam 管理 } }
  /prices:
    get:
      summary: 模型与价格表：站内每个模型一行（NewAPI 渠道模型 ∪ 厂商模型），只读 NewAPI 选项
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, normal, deviation, no_price, per_request] } }
        - { name: vendor, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 模型名或别名；前缀命中排在中间命中前面 }
      responses: { '200': { description: 'data = {items: PriceRow[], counts: {all, normal, deviation, no_price, per_request}, note}。counts 按厂商和搜索过滤后统计，不受 status 影响；默认缺价的排在前面' } }
  /prices/sync:
    post:
      summary: 立即同步价格库（运行 price_book 任务并等待完成，等同 /jobs/price_book?wait=1）
      responses: { '200': { description: 'data = JobStatus（last_message 形如“获取 N 条，更新 M 个，缺价 K 个”）' }, '500': { description: 任务失败，data 为 JobStatus } }
  /prices/{model}:
    parameters: [{ name: model, in: path, required: true, schema: { type: string } }]
    get:
      summary: 模型明细：原厂价、价格库行、手动覆盖、指向它的别名、使用它的渠道及成本
      responses: { '200': { description: 'data = {model, official_name, official, book, override, aliases, channels: [{id, name, vendor, discount, discount_source, override, cost_in_per_m, cost_out_per_m, cost_per_request}]}。discount 为该模型实际倍率，null = 算不出' } }
  /prices/{model}/override:
    parameters: [{ name: model, in: path, required: true, schema: { type: string } }]
    put:
      summary: 手动覆盖原厂价（只写 nam.db）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PriceOverrideInput' } } } }
      responses: { '200': { description: data = PriceOverride }, '400': { description: 价格必须是不小于 0 的有限数；按 token 必须有输入价，按次必须有单次价 } }
    delete:
      summary: 清除手动覆盖
      responses: { '200': { description: ok } }
  /aliases:
    get:
      summary: 全部别名，按原厂模型分组
      responses: { '200': { description: 'data = [{official, aliases: string[]}]' } }
  /aliases/{official}:
    parameters: [{ name: official, in: path, required: true, schema: { type: string } }]
    put:
      summary: 替换某个原厂模型的全部别名（只写 nam.db）
      requestBody: { content: { application/json: { schema: { type: object, required: [aliases], properties: { aliases: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: 'data = {official, aliases}' }, '400': { description: 别名与原厂名相同，或已是价格库中的模型名 }, '409': { description: 别名已属于另一个原厂模型 } }
  /upstreams/{id}/derive:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: 倍率预览：每个渠道现算的倍率（来源、原因、上游分组倍率）和逐模型推算，不写任何东西
      responses: { '200': { description: 'data = {upstream_id, channels: [{channel_id, name, group, discount, discount_source, discount_reason, upstream_group_ratio, derivation: {median, models: ModelDiscount[]}}]}' }, '404': { description: 上游不存在 } }
  /upstreams/{id}/credential:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: 查看凭证明文（高危：嵌入模式需二次验证）
      responses: { '200': { description: data = Credential } }
  /newapi/channels:
    get:
      summary: 直接读取 NewAPI 渠道（不含 key）
      responses: { '200': { description: 'data = {total, items: NewAPIChannel[]}' }, '502': { description: NewAPI 不可达 } }
  /jobs:
    get:
      summary: 后台任务状态
      responses: { '200': { description: 'data = JobStatus[]' } }
  /jobs/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: wait, in: query, schema: { type: boolean }, description: 为 1 时等待任务完成 }
    post:
      summary: 立即运行（加入串行队列）。name=pricing 执行定价任务：重新计算全部厂商（含首次接管），pricing_auto_write 为 true 时自动写入跟随模式、待写入且非小变动的厂商；摘要形如“N 个厂商；写入 x；待确认 y；漂移 z；无可用渠道 w”
      responses: { '200': { description: ok }, '404': { description: 未知任务 } }
  /settings:
    get:
      responses: { '200': { description: data = Settings } }
    put:
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
      responses: { '200': { description: data = Settings（更新后） }, '400': { description: 校验失败或未知键 } }
  /ui/layout:
    get:
      summary: 当前用户的界面布局（按用户 id 存在 nam.db）
      responses:
        '200': { description: 'data = UiLayoutResponse；从未保存过时 layout = null，saved_at = 0' }
        '401': { description: 没有有效的用户身份 }
    put:
      summary: 保存当前用户的界面布局（整份覆盖，不写审计）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                layout: { type: object, additionalProperties: true, description: 必须是 JSON 对象；整个请求体不超过 256 KB }
      responses:
        '200': { description: 'data = {saved_at: integer}（Unix 秒）' }
        '400': { description: layout 不是 JSON 对象，或请求体超过 256 KB（布局太大） }
        '401': { description: 没有有效的用户身份 }
  /audit:
    get:
      parameters:
        - { name: kind, in: query, schema: { type: string } }
        - { name: trigger, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: 'data = {total, items: AuditLog[]}' } }
  /audit/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      responses: { '200': { description: data = AuditLog } }
  /stats/channels:
    get:
      summary: 渠道统计（latest = 每渠道最近 100 条日志，缓存 60 秒；Nh / Nd 读小时聚合）
      parameters:
        - name: window
          in: query
          schema: { type: string, default: latest, pattern: '^(latest|[1-9][0-9]{0,3}[hd])$' }
          description: >-
            latest，或 N 小时 / N 天形式的时长（Nh、Nd，N 为不含前导零的正整数，如 12h、3d、30d）；
            总时长不超过 186 天（1h–4464h / 1d–186d），否则 400。
        - name: model
          in: query
          schema: { type: string, maxLength: 200 }
          description: >-
            按模型统计。去掉首尾空白后为空 = 渠道总计（与不传相同）；不为空时，每个渠道只返回该模型的数据，
            没有该模型数据的渠道不出现；std_cost_price 按该模型计价，价格档只在含该模型的渠道之间比较。
      responses: { '200': { description: data = StatsChannelList }, '400': { description: window 不合法，或 model 超过 200 个字符 } }
  /stats/channels/{id}/models:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: 渠道的模型明细
      parameters:
        - name: window
          in: query
          schema: { type: string, default: latest, pattern: '^(latest|[1-9][0-9]{0,3}[hd])$' }
          description: >-
            latest，或 N 小时 / N 天形式的时长（Nh、Nd，N 为不含前导零的正整数，如 12h、3d、30d）；
            总时长不超过 186 天（1h–4464h / 1d–186d），否则 400。
      responses: { '200': { description: 'data = {items: StatsModelItem[]}' }, '400': { description: window 或 id 不合法 } }
  /stats/overview:
    get:
      summary: 统计总览：总计、排行、错误类别、价格-质量散点
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer }, description: Unix 秒 }
        - { name: to, in: query, required: true, schema: { type: integer }, description: Unix 秒，须大于 from，跨度不超过 186 天 }
        - { name: dim, in: query, required: true, schema: { type: string, enum: [channel, model, upstream, vendor] } }
      responses: { '200': { description: data = StatsOverview }, '400': { description: 参数不合法 } }
  /stats/series:
    get:
      summary: 时间序列，只返回有数据的点，按 t 升序
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
        - { name: dim, in: query, schema: { type: string, enum: [channel, model, upstream, vendor] }, description: 为空 = 全站 }
        - { name: key, in: query, schema: { type: string }, description: dim 对应的 key }
        - { name: bucket, in: query, required: true, schema: { type: string, enum: [hour, day] } }
      responses: { '200': { description: data = StatsSeries }, '400': { description: 参数不合法 } }
  /stats/status:
    get:
      summary: 统计拉取状态
      responses: { '200': { description: data = StatsStatus } }
  /stats/rebuild:
    post:
      summary: 清空聚合和游标，并重新统计最近 N 天（随后触发 pull_logs）
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [days], properties: { days: { type: integer, minimum: 1, maximum: 90 } } }
      responses: { '200': { description: data = null }, '400': { description: days 不在 1–90 } }
