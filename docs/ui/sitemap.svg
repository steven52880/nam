  <rect class="bg" width="1440" height="894"/>
  <text class="h1" x="40" y="34">nam（newapi-manager）界面站点图</text>
  <text class="h2" x="40" y="52">页面 · 弹窗 · 抽屉 · 确认框 · 页面间跳转；对应 docs/ui/mockup.html 与 ui-spec.md</text>
