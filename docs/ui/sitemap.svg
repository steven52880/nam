<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="894" viewBox="0 0 1440 894" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title>nam 界面站点图</title>
  <style>
    .bg{fill:#f4f5f7}.h1{font-size:18px;font-weight:600;fill:#1a202c}.h2{font-size:12px;fill:#8b93a1}
    .n rect{stroke-width:1.4}.n .t{font-size:12px;font-weight:600;fill:#1a202c}.n .s{font-size:10.5px;fill:#4a5261}
    .pg rect{fill:#e9efff;stroke:#2952cc}.pg .t{fill:#1e40af}
    .md rect{fill:#fff;stroke:#b45309}.dr rect{fill:#efe8fd;stroke:#6d28d9}.cf rect{fill:#fde8e8;stroke:#c81e1e}
    .jp rect{fill:#fff;stroke:#2952cc;stroke-dasharray:4 3}.jp .t{fill:#2952cc}.ac rect{fill:#fafbfc;stroke:#8b93a1}
    .gl rect{fill:#fff;stroke:#c9ced6}.wb circle{fill:#fff1b8;stroke:#e0b400}.wb text{font-size:9.5px;font-weight:600;fill:#6b4e00;text-anchor:middle}
    .ln{stroke:#b9bfc9;stroke-width:1.2;fill:none}.ln.d{stroke-dasharray:4 3}.ln.a{stroke:#2952cc}
    .lbl{font-size:10.5px;fill:#8b93a1}.zone{fill:#fff;stroke:#e1e4e8}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b9bfc9"/></marker>
