<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nam · NewAPI 管理工具 · 界面原型</title>
<link rel="icon" href="data:,">
<style>
/* ---- 01-base.css ---- */
:root{
  --bg:#f4f5f7;--panel:#fff;--sub:#fafbfc;--line:#e1e4e8;--line2:#eef0f2;
  --tx:#1a202c;--tx2:#4a5261;--mut:#8b93a1;
  --ac:#2952cc;--ac2:#1e40af;--ac-bg:#e9efff;
  --ok:#15803d;--ok-bg:#e7f5ec;--warn:#b45309;--warn-bg:#fdf3dc;
  --err:#c81e1e;--err-bg:#fde8e8;--drift:#6d28d9;--drift-bg:#efe8fd;
  --draft:#fff1b8;--draft-line:#e0b400;--sel:#dbe6ff;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.num{text-align:right}
.mut{color:var(--mut)}.tx2{color:var(--tx2)}.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-err{color:var(--err)}.c-drift{color:var(--drift)}
.small{font-size:11.5px}
.ic{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
a{color:var(--ac);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
h4{margin:14px 0 6px;font-size:12.5px;font-weight:600}
h4:first-child{margin-top:0}
p{margin:0 0 8px}
/* layout */
.app{display:grid;grid-template-columns:196px minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);height:100vh}
.side{grid-column:1;grid-row:1/3;background:var(--sub);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);font-weight:600}
.brand .logo{width:22px;height:22px;border-radius:5px;background:var(--tx);color:#fff;display:grid;place-items:center;font:600 11px var(--mono)}
.brand small{color:var(--mut);font-weight:400;font-size:11px}
.nav{padding:6px 0;flex:1;overflow:auto}
.nav .sec{padding:10px 16px 3px;font-size:11px;color:var(--mut)}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;margin:1px 8px;border-radius:5px;color:var(--tx2)}
.nav a:hover{background:#eef0f3;text-decoration:none}
.nav a.on{background:var(--ac-bg);color:var(--ac);font-weight:600}
.nav a .cnt{margin-left:auto;font:11px var(--mono);color:var(--mut)}
.nav a .cnt.warn{color:var(--warn)}.nav a .cnt.err{color:var(--err)}
.nav a .pre{margin-left:auto;font-size:10px;color:var(--mut);border:1px dashed #c9ced6;border-radius:3px;padding:0 4px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:11px;color:var(--mut);line-height:1.7}
.top{grid-column:2;grid-row:1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.top h1{font-size:14px;margin:0;font-weight:600;white-space:nowrap}
.crumb{color:var(--mut);font-size:12px;white-space:nowrap}
.gsearch{position:relative;margin-left:auto;width:340px}
.gsearch input{width:100%;height:30px;padding:0 64px 0 30px;border:1px solid var(--line);border-radius:6px;background:var(--sub);outline:none}
.gsearch input:focus{background:#fff;border-color:var(--ac)}
.gsearch > .ic{position:absolute;left:9px;top:8px;color:var(--mut)}
.gsearch kbd{position:absolute;right:8px;top:6px}
.gs-pop{position:absolute;top:34px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.12);z-index:60;max-height:380px;overflow:auto;padding:4px}
.gs-pop:empty{display:none}
.gs-pop .grp{font-size:11px;color:var(--mut);padding:6px 8px 2px}
.gs-pop a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:4px;color:var(--tx)}
.gs-pop a:hover{background:var(--ac-bg);text-decoration:none}
.gs-pop a .mut{margin-left:auto;font-size:11px}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);white-space:nowrap;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:5px}
.conn:hover{background:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--mut)}
.dot.ok{background:#22a35a}.dot.warn{background:#e0a100}.dot.err{background:#e03131}.dot.drift{background:var(--drift)}.dot.off{background:#c3c8d0}
.draftbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--draft-line);background:var(--draft);color:#6b4e00;cursor:pointer;font-size:12px;white-space:nowrap}
.draftbtn.zero{background:var(--sub);border-color:var(--line);color:var(--mut)}
.draftbtn b{font-family:var(--mono)}
.umenu{position:relative}
.avatar{width:28px;height:28px;border-radius:50%;background:#e4e7ec;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;border:0}
.dd{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.12);min-width:190px;padding:4px;z-index:60}
.dd .who{padding:6px 10px;font-size:12px;color:var(--mut)}
.dd button,.ctx button{display:flex;width:100%;gap:8px;align-items:center;padding:6px 10px;border:0;background:none;border-radius:4px;color:var(--tx);text-align:left;cursor:pointer;white-space:nowrap}
.dd button:hover,.ctx button:hover{background:var(--sub)}
.dd hr,.ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.dd .danger,.ctx .danger{color:var(--err)}
.ctx button kbd{margin-left:auto}
.main{grid-column:2;grid-row:2;overflow:auto;min-height:0;position:relative}
.page{padding:14px 18px 56px;min-width:1180px}
.page.fill{height:100%;display:flex;flex-direction:column;padding-bottom:12px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.ph h2{margin:0;font-size:17px;font-weight:600}
.ph p{margin:2px 0 0;color:var(--mut);font-size:12px}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---- 02-comp.css ---- */
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--tx);cursor:pointer;white-space:nowrap;font-size:12.5px}
.btn:hover{background:var(--sub);border-color:#cfd4db}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2)}
.btn.warn{background:var(--draft);border-color:var(--draft-line);color:#6b4e00}
.btn.danger{color:var(--err);border-color:#f0c4c4}.btn.danger:hover{background:var(--err-bg)}
.btn.dangerfill{background:var(--err);border-color:var(--err);color:#fff}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:#eef0f3}
.btn.sm{height:22px;padding:0 7px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp,.sel{height:28px;border:1px solid var(--line);border-radius:5px;padding:0 8px;background:#fff;outline:none;min-width:0}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-bg)}
textarea.inp{height:auto;padding:6px 8px;resize:vertical;font-family:var(--mono);font-size:12px}
.inp.mono{font-family:var(--mono);font-size:12px}
.inp.err{border-color:var(--err)}
kbd{font:10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff;color:var(--tx2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:0 10px;height:26px;cursor:pointer;color:var(--tx2);border-right:1px solid var(--line);font-size:12px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ac-bg);color:var(--ac);font-weight:600}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tb .lbl{font-size:11.5px;color:var(--mut);margin-right:-4px}
.tb .sp{flex:1}
.tb .divider{width:1px;height:20px;background:var(--line)}
.search{position:relative}.search .ic{position:absolute;left:8px;top:7px;color:var(--mut)}.search .inp{padding-left:26px;width:220px}
.switch{position:relative;display:inline-block;width:30px;height:17px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#cfd4db;border-radius:9px;cursor:pointer;transition:background .15s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:transform .15s}
.switch input:checked+span{background:var(--ac)}
.switch input:checked+span::after{transform:translateX(13px)}
input[type=checkbox]{accent-color:var(--ac);margin:0;vertical-align:-2px}
/* tags & badges */
.tag{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:3px;background:#eef0f3;color:var(--tx2);font-size:11px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}.tag.drift{background:var(--drift-bg);color:var(--drift)}
.tag.ac{background:var(--ac-bg);color:var(--ac)}.tag.draft{background:var(--draft);color:#6b4e00}
.tag.line{background:#fff;border:1px solid var(--line)}
.tag.mono{font-family:var(--mono)}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px}
.badge-k{font:600 9.5px var(--sans);border-radius:2px;padding:0 3px;margin-left:3px;vertical-align:1px}
.badge-k.a{background:#eef0f3;color:var(--mut)}.badge-k.m{background:var(--ac-bg);color:var(--ac)}
.badge-k.x{background:var(--warn-bg);color:var(--warn)}
/* panel/card */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>.hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2)}
.panel>.hd h3{margin:0;font-size:13px;font-weight:600}
.panel>.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel>.bd{padding:12px}
.panel>.bd.np{padding:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.alert{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:6px;background:#fff;cursor:pointer;text-align:left}
.alert:hover{box-shadow:0 2px 8px rgba(16,24,40,.08)}
.alert .n{font:600 22px/1.1 var(--mono)}
.alert .t{font-size:12px;color:var(--tx2)}
.alert .go{font-size:11px;color:var(--ac);margin-top:2px}
.alert.err{border-left-color:var(--err)}.alert.err .n{color:var(--err)}
.alert.warn{border-left-color:#e0a100}.alert.warn .n{color:var(--warn)}
.alert.drift{border-left-color:var(--drift)}.alert.drift .n{color:var(--drift)}
.alert.zero{border-left-color:#22a35a}.alert.zero .n{color:var(--ok)}
.kpi{padding:10px 12px}
.kpi .l{font-size:11.5px;color:var(--mut)}
.kpi .v{font:600 20px/1.3 var(--mono)}
.kpi .d{font:11px var(--mono)}
.kpi .d.up{color:var(--ok)}.kpi .d.dn{color:var(--err)}
.bar{height:6px;background:#eef0f3;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ac)}
.bar.ok i{background:#22a35a}.bar.warn i{background:#e0a100}.bar.err i{background:#e03131}
/* tables */
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.panel .tw{border:0;border-radius:0}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.t th{position:sticky;top:0;z-index:2;background:var(--sub);text-align:left;font-weight:600;color:var(--tx2);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.t th.num{text-align:right}
.t th.sort{cursor:pointer}.t th.sort:hover{color:var(--tx)}
.t th .arr{color:var(--ac);margin-left:2px}
.t td{padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:#f7f9fc}
.t tr.on td{background:#eef3ff}
.t td.wrap{white-space:normal}
.t tr.click{cursor:pointer}
.t .rowacts{display:flex;gap:4px;justify-content:flex-end}
.t.dense th,.t.dense td{padding-left:6px;padding-right:6px}
.t tr.exp td{background:#fbfcfd;padding:10px 14px}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--tx2);font-size:13px;margin-bottom:4px}
.empty .btn{margin-top:10px}

/* ---- 03-sheet-overlay.css ---- */
/* spreadsheet grid (channels) */
.split{display:flex;flex-direction:column;flex:1;min-height:0;gap:0}
.split .upper{flex:1 1 60%;min-height:160px;display:flex;flex-direction:column}
.split .lower{flex:0 0 36%;min-height:150px;display:flex;flex-direction:column;margin-top:0}
.split .resizer{height:8px;cursor:row-resize;display:flex;align-items:center;justify-content:center}
.split .resizer::before{content:"";width:40px;height:3px;border-radius:2px;background:#cfd4db}
.sheetwrap{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;position:relative;outline:none}
table.sheet{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
.sheet th{position:sticky;top:0;z-index:3;background:var(--sub);font-weight:600;color:var(--tx2);font-size:11px;padding:5px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);white-space:nowrap;text-align:left;user-select:none}
.sheet th.num{text-align:right}
.sheet th .ed{color:var(--ac);font-weight:400;margin-left:2px}
.sheet td{padding:0 7px;height:27px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);white-space:nowrap;user-select:none;position:relative}
.sheet td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet td.edit{cursor:cell}
.sheet td.sel{background:var(--sel)!important;box-shadow:inset 0 0 0 1px #7d9cf0}
.sheet td.lock{box-shadow:inset 0 0 0 1px var(--ac);background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(41,82,204,.08) 4px 8px)}
.sheet td.dirty{background:var(--draft)}
.sheet td.dirty::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 6px 6px 0;border-color:transparent var(--draft-line) transparent transparent}
.sheet td.driftc{background:var(--drift-bg)}
.sheet tr.row:hover td{background:#f7f9fc}
.sheet tr.row.cur td{background:#eef3ff}
.sheet tr.row.cur td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.sheet tr.row.dis td{color:var(--mut)}
.sheet tr.grp td{background:#f1f3f6;font-weight:600;height:26px;cursor:pointer;color:var(--tx2);position:sticky;top:27px;z-index:2}
.sheet tr.grp td .gm{font-weight:400;color:var(--mut);margin-left:14px;font-family:var(--mono);font-size:11px}
.sheet tr.grp td .gm b{color:var(--tx2);font-weight:600}
.sheet td input.cellin{position:absolute;inset:0;width:100%;height:100%;border:2px solid var(--ac);padding:0 5px;font:inherit;font-family:var(--mono);outline:none;text-align:right;background:#fff}
.sheet td.sticky1,.sheet th.sticky1{position:sticky;left:0;z-index:1;background:inherit}
.sheet th.sticky1{z-index:4;background:var(--sub)}
.sheet tr.row td.sticky1{background:#fff}
.sheet .caret{display:inline-block;width:12px;color:var(--mut)}
.hint{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--mut);padding:6px 2px 0;flex-wrap:wrap}
.hint .lockmsg{color:var(--ac);font-weight:600}
.hint .warnmsg{color:var(--warn);font-weight:600}
.syncs{display:inline-flex;align-items:center;gap:5px}
/* overlay: modal / drawer */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.36);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:6vh}
.ov.drawer{justify-content:flex-end;padding:0;align-items:stretch}
.modal{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(16,24,40,.28);width:720px;max-width:calc(100vw - 40px);max-height:86vh;display:flex;flex-direction:column}
.modal.w-s{width:460px}.modal.w-l{width:960px}.modal.w-xl{width:1120px}
.modal .mh,.drw .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal .mh h3,.drw .mh h3{margin:0;font-size:14.5px;font-weight:600}
.modal .mh .x,.drw .mh .x{margin-left:auto}
.modal .mb{padding:14px 16px;overflow:auto;flex:1;min-height:0}
.modal .mf,.drw .mf{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);background:var(--sub);border-radius:0 0 10px 10px}
.modal .mf .l,.drw .mf .l{margin-right:auto;font-size:12px;color:var(--mut)}
.drw{width:880px;max-width:92vw;background:#fff;height:100%;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(16,24,40,.18)}
.drw.w-s{width:620px}
.drw .db{flex:1;overflow:auto;padding:14px 16px;min-height:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;background:#fff}
.tabs button{border:0;background:none;padding:9px 10px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:12.5px;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.tabs button .tag{margin-left:4px}
/* form */
.fm{display:grid;grid-template-columns:130px minmax(0,1fr);gap:9px 12px;align-items:center}
.fm>label{color:var(--tx2);font-size:12px;text-align:right}
.fm .help{grid-column:2;font-size:11.5px;color:var(--mut);margin-top:-5px}
.fm .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fm .inp,.fm .sel{width:100%}
.fm .row .inp,.fm .row .sel{width:auto}
.radio-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rc{border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;background:#fff;text-align:left}
.rc.on{border-color:var(--ac);background:var(--ac-bg)}
.rc b{display:block;font-size:12.5px}.rc span{font-size:11.5px;color:var(--mut)}
.steps{display:flex;gap:0;padding:10px 16px;border-bottom:1px solid var(--line2);background:var(--sub)}
.steps .s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex:1}
.steps .s i{width:18px;height:18px;border-radius:50%;border:1px solid #cfd4db;display:grid;place-items:center;font:600 10.5px var(--mono);font-style:normal;background:#fff}
.steps .s.on{color:var(--ac);font-weight:600}.steps .s.on i{background:var(--ac);border-color:var(--ac);color:#fff}
.steps .s.done{color:var(--tx2)}.steps .s.done i{background:var(--ok-bg);border-color:#9fd3b1;color:var(--ok)}
.steps .s:not(:last-child)::after{content:"";flex:1;height:1px;background:var(--line);margin:0 8px}
.note{padding:8px 10px;border-radius:6px;background:var(--sub);border:1px solid var(--line);font-size:12px;color:var(--tx2)}
.note.warn{background:var(--warn-bg);border-color:#f2d79a;color:#7a4a05}
.note.err{background:var(--err-bg);border-color:#f3c0c0;color:#8f1717}
.note.ac{background:var(--ac-bg);border-color:#c5d4fb;color:#1e3a8a}
.note.drift{background:var(--drift-bg);border-color:#d6c6f7;color:#4c1d95}
.code{font:11.5px/1.5 var(--mono);background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre;overflow:auto;color:#24292f;margin:0}
.diff .o{color:var(--err);text-decoration:line-through;text-decoration-color:rgba(200,30,30,.4)}
.diff .n{color:var(--ok);font-weight:600}
.diff .ar{color:var(--mut);margin:0 4px}
.prog{height:8px;background:#eef0f3;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);transition:width .25s}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
/* toasts / ctx / info */
#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#1f2633;color:#fff;padding:9px 12px;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:12.5px;max-width:380px;display:flex;gap:8px;align-items:center;border-left:3px solid #7d9cf0}
.toast.ok{border-left-color:#3cc276}.toast.warn{border-left-color:#f0b429}.toast.err{border-left-color:#f26464}
.ctx{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);padding:4px;min-width:200px}
.info{position:fixed;right:14px;bottom:10px;z-index:40;font-size:11.5px;color:var(--tx2);display:flex;justify-content:flex-end}
.info details[open]{width:300px;box-shadow:0 8px 24px rgba(16,24,40,.12)}
.page.fill{padding-bottom:40px!important}
.info details{background:#f1f2f4;border:1px solid #dcdfe4;border-radius:7px}
.info summary{cursor:pointer;padding:6px 10px;font-weight:600;color:var(--mut);list-style:none;display:flex;align-items:center;gap:6px}
.info summary::-webkit-details-marker{display:none}
.info summary::after{content:"展开";margin-left:auto;font-weight:400;font-size:11px}
.info details[open] summary::after{content:"收起"}
.info ul{margin:0;padding:0 12px 10px 26px;max-height:340px;overflow:auto;line-height:1.6}
/* charts */
.chart{width:100%;height:170px;display:block}
.chart text{font:10px var(--mono);fill:var(--mut)}
.chart .gl{stroke:#eef0f2}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--tx2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:3px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--bg)}
.login .box{width:360px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px 26px 20px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
.login h2{margin:12px 0 2px;font-size:17px}
.login .inp{width:100%;height:34px}
.login .btn{width:100%;justify-content:center;height:34px;margin-top:12px}
.login .foot{margin-top:16px;font-size:11.5px;color:var(--mut);line-height:1.6}
.placeholder{border:1px dashed #c9ced6;border-radius:8px;background:repeating-linear-gradient(135deg,#fafbfc 0 10px,#f4f5f7 10px 20px)}
.ribbon{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:4px;background:#fff;border:1px dashed #b9bfc9;color:var(--tx2);font-size:12px}
/* ---- 04-cost-pricing.css ---- */
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.sheet th[title],.t th[title]{text-decoration:underline dotted #b5bcc7;text-underline-offset:3px;cursor:help}
.coef{display:inline-block;min-width:46px;padding:0 5px;border-radius:3px;text-align:right}
.coef.lowS{color:var(--mut)}
.tag.gA{background:var(--ok-bg);color:var(--ok)}.tag.gB{background:var(--ac-bg);color:var(--ac)}.tag.gC{background:var(--warn-bg);color:var(--warn)}
.ctx button[disabled]{opacity:.45;cursor:not-allowed;background:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--sub);min-height:42px;max-height:180px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 3px 0 8px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:12px}
.chip.new{background:var(--draft);border-color:var(--draft-line)}
.chip button{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 2px;display:inline-flex}
.chip button:hover{color:var(--err)}
.t tr.devrow td{background:var(--warn-bg)}
.t tr.ign td{color:var(--mut)}
.sc{width:100%;height:auto;display:block}
.sc text{font:10px var(--mono);fill:var(--mut)}
.sc .gl{stroke:#eef0f2}
.sc circle{cursor:pointer}
.sc circle:hover{stroke:#111;stroke-width:1.5}
.inp.draftv{background:var(--draft);border-color:var(--draft-line)}
.lines2{line-height:1.25}.lines2 .small{display:block}

function mountSearch() {
  const inp = $('#gs'), pop = $('#gspop');
  const run = () => {
    const q = inp.value.trim().toLowerCase();
    if (!q) { pop.innerHTML = ''; return; }
    const hit = (s) => String(s).toLowerCase().includes(q);
    const ups = UPSTREAMS.filter((u) => hit(u.name) || hit(u.id) || hit(u.url)).slice(0, 5);
    const chs = CHANNELS.filter((c) => hit(c.name)).slice(0, 6);
    const ms = MODELS.filter((m) => hit(m.m) || m.alias.some(hit)).slice(0, 5);
    const pg = NAV.filter((n) => n.id && hit(n.name));
    let h = '';
    if (pg.length) h += '<div class="grp">页面</div>' + pg.map((n) => `<a data-go="${n.id}">${ic(n.icon)}${n.name}</a>`).join('');
    if (ups.length) h += '<div class="grp">上游</div>' + ups.map((u) => `<a data-up="${u.id}">${ic('server')}${esc(u.name)}<span class="mut">${u.type}</span></a>`).join('');
    if (chs.length) h += '<div class="grp">渠道</div>' + chs.map((c) => `<a data-ch="${c.id}">${ic('grid')}<span class="mono">${esc(c.name)}</span><span class="mut">#${c.nid}</span></a>`).join('');
    if (ms.length) h += '<div class="grp">模型</div>' + ms.map((m) => `<a data-m="${m.m}">${ic('tag')}<span class="mono">${m.m}</span><span class="mut">${VENDORS[m.v] || m.v}</span></a>`).join('');
    pop.innerHTML = h || '<div class="empty" style="padding:14px">没有匹配项</div>';
  };
  inp.oninput = run;
  inp.onfocus = run;
  inp.onblur = () => setTimeout(() => { pop.innerHTML = ''; }, 150);
  pop.onmousedown = (e) => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.go) go(a.dataset.go);
    if (a.dataset.up) { go('upstreams'); setTimeout(() => openUpstreamDrawer(a.dataset.up), 30); }
    if (a.dataset.ch) { CH.cur = a.dataset.ch; go('channels'); }
    if (a.dataset.m) { MS.q = a.dataset.m; MS.st = 'all'; go('msync'); }
  };
}

function mountLogin() {
  const f = $('#loginform'), p = $('#pwd'), er = $('#loginerr');

    <div class="tw"><table class="t"><thead><tr><th style="width:28px"><input type="checkbox" id="up-all"></th><th>名称</th><th>类型</th><th>标签</th><th class="num" title="${esc(TERM.r.t)}">充值汇率 元/$</th><th>凭证</th><th class="num">余额 USD</th><th class="num">折合 元</th><th class="num">令牌</th><th class="num">渠道</th><th>最近同步</th><th>错误</th><th></th></tr></thead><tbody>
    ${rows.length ? rows.map((u) => { const y = u.bal == null ? null : u.bal * u.r; return `<tr class="click ${UP.sel.has(u.id) ? 'on' : ''}" data-up="${u.id}">
      <td><input type="checkbox" data-chk="${u.id}" ${UP.sel.has(u.id) ? 'checked' : ''}></td>
      <td><b>${esc(u.name)}</b><div class="mut small mono">${esc(u.url)}</div></td><td>${typeTag(u.type)}</td>
      <td>${u.tags.map((t) => `<span class="tag">${t}</span>`).join(' ')}</td><td class="num">${u.r}</td>
      <td>${u.cred === 'ok' ? `<span class="st"><span class="dot ok"></span>${u.credKind}</span>` : `<span class="st c-err"><span class="dot err"></span>${u.credKind} 失效</span>`}</td>
      <td class="num">${u.bal == null ? '<span class="mut">不查询</span>' : fmt(u.bal)}</td>
      <td class="num ${y != null && y < 5 ? 'c-err' : y != null && y < 20 ? 'c-warn' : ''}">${y == null ? '—' : fmt(y)}</td>
      <td class="num">${UP_TOKENS[u.id].length}</td><td class="num">${tokensOf(u.id).length}</td>
      <td class="mono">${u.sync}</td><td class="small ${u.err ? 'c-err' : 'mut'}">${esc(u.err || '—')}</td>
      <td><div class="rowacts"><button class="btn sm ghost" data-syncone="${u.id}" title="立即同步">${ic('refresh')}</button></div></td></tr>`; }).join('')
      : `<tr><td colspan="13"><div class="empty"><b>没有符合条件的上游</b>调整筛选，或新增一个上游。<br><button class="btn" data-clearall>清除筛选</button></div></td></tr>`}
    </tbody></table></div>
    ${infoBox(['表格列：名称/地址、类型、标签、r、凭证状态、余额 USD 与折合元、令牌数、渠道数、最近同步、错误', '新增上游向导：填地址→自动识别类型→选凭证→连通性测试→填 r 与标签→保存并同步令牌', '批量同步：勾选后同步余额、令牌、分组倍率（串行）', '筛选：类型、标签、搜索；点行打开详情抽屉', '本页操作只写 nam 数据库，不写 NewAPI；改 r 会影响成本与下一轮定价'])}`;
  },
  mount(root) {
    $('#up-add', root).onclick = openAddUpstream;
    $('#up-type', root).onchange = (e) => { UP.type = e.target.value; rerenderPage(); };
    $('#up-tag', root).onchange = (e) => { UP.tag = e.target.value; rerenderPage(); };
    $('#up-q', root).oninput = (e) => { UP.q = e.target.value; const p = e.target.selectionStart; rerenderPage(); const n = $('#up-q'); n.focus(); n.setSelectionRange(p, p); };
    root.querySelector('[data-clearf]')?.addEventListener('click', () => { UP.f = ''; rerenderPage(); });
    root.querySelector('[data-clearall]')?.addEventListener('click', () => { Object.assign(UP, { f: '', type: 'all', tag: 'all', q: '' }); rerenderPage(); });
    $('#up-all', root).onchange = (e) => { UPSTREAMS.forEach((u) => e.target.checked ? UP.sel.add(u.id) : UP.sel.delete(u.id)); rerenderPage(); };
    $$('[data-chk]', root).forEach((c) => c.onclick = (e) => { e.stopPropagation(); c.checked ? UP.sel.add(c.dataset.chk) : UP.sel.delete(c.dataset.chk); rerenderPage(); });
    $$('tr[data-up]', root).forEach((r) => r.onclick = (e) => { if (!e.target.closest('button,input')) openUpstreamDrawer(r.dataset.up); });
    $$('[data-syncone]', root).forEach((b) => b.onclick = () => toast(`已加入同步队列：${UP_BY[b.dataset.syncone].name}`));
    $('#up-sync', root).onclick = () => { toast(`已加入同步队列：${UP.sel.size} 个上游（串行执行）`, 'ok'); UP.sel.clear(); rerenderPage(); };
  },
};

// 新增上游向导
function openAddUpstream() {
  const st = { step: 1, url: '', type: '', cred: 'token' };
  const names = ['站点地址', '识别类型', '凭证', '连通性测试', '汇率与标签'];
  const ov = openModal({ title: '新增上游', size: 'w-l', head: '<div class="steps" id="aw-steps"></div>', body: '<div id="aw-body"></div>', foot: '<span class="l" id="aw-l"></span><button class="btn" data-close>取消</button><button class="btn" id="aw-prev">上一步</button><button class="btn pri" id="aw-next">下一步</button>' });
  const draw = () => {
    $('#aw-steps', ov).innerHTML = names.map((n, i) => `<div class="s ${i + 1 === st.step ? 'on' : i + 1 < st.step ? 'done' : ''}"><i>${i + 1 < st.step ? '✓' : i + 1}</i>${n}</div>`).join('');
    $('#aw-prev', ov).disabled = st.step === 1;
    $('#aw-next', ov).textContent = st.step === 5 ? '保存并同步令牌' : '下一步';
    $('#aw-l', ov).textContent = `第 ${st.step} / 5 步`;
    const b = $('#aw-body', ov);
    if (st.step === 1) b.innerHTML = `<div class="fm"><label>名称</label><input class="inp" id="aw-name" placeholder="如：星河中转" value="${esc(st.name || '')}"><label>站点地址</label><input class="inp mono" id="aw-url" placeholder="https://api.example.com（根地址，不带 /v1）" value="${esc(st.url)}"><div class="help">会依次请求 /api/status、/api/v1/auth/me 等接口识别站点类型。</div></div>`;
    if (st.step === 2) b.innerHTML = `<div class="note ac" style="margin-bottom:12px">${ic('check')} 识别结果：<b>newapi</b>（/api/status 返回 system_name="XX API"，quota_per_unit=500000，版本 v0.9.x）</div>
      <div class="fm"><label>类型</label><div class="radio-cards" id="aw-types">${Object.keys(TYPES).map((t) => `<button class="rc ${st.type === t ? 'on' : ''}" data-t="${t}"><b class="mono">${t}</b><span>${{ newapi: 'NewAPI / VoAPI / Veloera', 'sk-key': '只有 sk-key 的 newapi 类', sub2api: 'Sub2API', onehub: 'OneHub / DoneHub / OneAPI', official: '官方直连，价格倍率默认 1', generic: '定制中转，手动配置适配器' }[t]}</span></button>`).join('')}</div></div>`;
    if (st.step === 3) b.innerHTML = `<div class="fm"><label>凭证方式</label><div class="seg" id="aw-cred"><button data-c="token" class="${st.cred === 'token' ? 'on' : ''}">Access Token + 用户 ID</button><button data-c="pwd" class="${st.cred === 'pwd' ? 'on' : ''}">账号密码</button><button data-c="sk" class="${st.cred === 'sk' ? 'on' : ''}">sk-key</button></div>
      ${st.cred === 'token' ? '<label>Access Token</label><input class="inp mono" type="password" value="xxxxxxxxxxxxxxxx"><label>平台用户 ID</label><input class="inp mono" value="1024" style="width:140px"><div class="help">在上游“个人设置 → 系统访问令牌”生成。</div>' : ''}
      ${st.cred === 'pwd' ? '<label>账号</label><input class="inp" value="lingyun"><label>密码</label><input class="inp" type="password" value="********"><div class="help">登录换取 session；密码以 AES-GCM 加密保存，主密钥来自环境变量 NAM_SECRET。</div>' : ''}
      ${st.cred === 'sk' ? '<label>sk-key</label><input class="inp mono" type="password" value="sk-xxxxxxxx"><div class="help">只有 key 时：余额走 /v1/dashboard/billing/*，无令牌列表与分组倍率，价格倍率需手动填写。</div>' : ''}</div>`;
    if (st.step === 4) b.innerHTML = `<table class="t"><thead><tr><th>检查项</th><th>请求</th><th>结果</th><th class="num">耗时</th></tr></thead><tbody>
      <tr><td>站点可达</td><td class="mono small">GET /api/status</td><td><span class="st c-ok"><span class="dot ok"></span>200</span></td><td class="num">212ms</td></tr>
      <tr><td>凭证有效</td><td class="mono small">GET /api/user/self</td><td><span class="st c-ok"><span class="dot ok"></span>用户 lingyun，余额 $182.40</span></td><td class="num">188ms</td></tr>
      <tr><td>令牌列表</td><td class="mono small">GET /api/token/</td><td><span class="st c-ok"><span class="dot ok"></span>5 个令牌</span></td><td class="num">240ms</td></tr>
      <tr><td>分组倍率</td><td class="mono small">GET /api/user/self/groups · /api/pricing</td><td><span class="st c-ok"><span class="dot ok"></span>4 个分组，318 个模型倍率</span></td><td class="num">402ms</td></tr>
      <tr><td>公告</td><td class="mono small">GET /api/notice</td><td><span class="st"><span class="dot warn"></span>为空</span></td><td class="num">95ms</td></tr></tbody></table>
      <div class="hint">失败时显示 HTTP 状态与响应片段，可返回上一步修改凭证。<button class="btn sm" id="aw-retest">${ic('refresh')}重新测试</button></div>`;
    if (st.step === 5) b.innerHTML = `<div class="fm"><label>充值汇率</label><div class="row"><input class="inp mono" id="aw-r" value="0.55" style="width:100px"><span class="mut small">元 / 1 美元额度。例：充 100 元得 $180 额度 → 充值汇率 = 0.556</span></div>
      <label>标签</label><input class="inp" value="主力, claude" placeholder="逗号分隔"><label>备注</label><input class="inp" placeholder="可选">
      <label>保存后</label><div class="row"><label class="row small"><input type="checkbox" checked> 立即同步令牌和分组倍率</label><label class="row small"><input type="checkbox" checked> 同步余额</label></div></div>
      <div class="note" style="margin-top:12px">只写入 nam 数据库，不会改动 NewAPI。渠道需在“渠道”页通过批量创建生成并应用。</div>`;
    $$('#aw-types .rc', ov).forEach((x) => x.onclick = () => { st.type = x.dataset.t; draw(); });
    $$('#aw-cred button', ov).forEach((x) => x.onclick = () => { st.cred = x.dataset.c; draw(); });
    $('#aw-retest', ov)?.addEventListener('click', () => toast('连通性测试通过', 'ok'));
  };
  $('#aw-prev', ov).onclick = () => { st.step--; draw(); };
  $('#aw-next', ov).onclick = () => {
    if (st.step === 1) { const u = $('#aw-url', ov); st.name = $('#aw-name', ov).value; st.url = u.value; if (!/^https?:\/\//.test(st.url)) { u.classList.add('err'); toast('请填写以 http(s):// 开头的站点地址', 'err'); return; } st.type = 'newapi'; }
    if (st.step === 5) { closeOv(ov); toast('已保存上游，正在同步令牌…', 'ok'); return; }
    st.step++; draw();
  };
  draw();
}

// 上游模型价格（R5）：上游原始价 = 官方价 × 上游模型倍率 ÷ 官方模型倍率；分组实际价 = 原始价 × 分组倍率
const UPP = { grp: {} };

function stOf(c, w = CH.win) {

}
function winNote(w = CH.win) {
  const ns = CHANNELS.filter((c) => !c.isNew).map((c) => stOf(c, w).n);

}
const visCols = () => COLS.filter((c) => !CH.hidden.has(c.id));

const syncState = (c) => DEL.has(c.id) ? 'del' : c.isNew ? 'new' : dirtyFields(c).length ? 'draft' : c.sync;
const SYNC_TAG = { ok: '<span class="st"><span class="dot ok"></span>已同步</span>', draft: '<span class="tag draft">草稿</span>', new: '<span class="tag draft">草稿·新建</span>', del: '<span class="tag err">草稿·删除</span>', drift: '<span class="tag drift" data-drift>漂移 · 查看</span>', error: '<span class="tag err" title="上游凭证失效，无法同步余额与倍率">错误</span>' };

function cellRaw(c, col) {

}
const lowS = (s) => s && s.n < 30;
function rateTag(c) {

  return `${pv} <span class="tag g${r.q}" title="${RATE_TITLE}">质量 ${r.q}</span>`;

function cellHtml(c, col) {
  switch (col) {
    case 'st': { const d = c.status === 'on' ? 'ok' : c.status === 'auto-off' ? 'err' : 'off'; return `<span class="st"><span class="dot ${d}"></span><span class="small">${STATUS_TXT[c.status]}</span></span>`; }
    case 'name': return `<span class="mono">${esc(c.name)}</span>${c.nid && !c.isNew ? ` <span class="mut small mono">#${c.nid}</span>` : ''}`;
    case 'up': return esc(UP_BY[c.up].name);

    case 'r': return c.r;

    case 'tags': return c.tags ? c.tags.split(/[,，]\s*/).map((t) => `<span class="tag">${esc(t)}</span>`).join(' ') : '<span class="mut">—</span>';

  switch (col) {

function filteredChannels() {

    && (CH.fTag === 'all' || c.tags.split(/[,，]\s*/).includes(CH.fTag))
    && (CH.fSync === 'all' || syncState(c) === CH.fSync || (CH.fSync === 'draft' && ['draft', 'new', 'del'].includes(syncState(c))))
    && (!q || (c.name + c.token + c.models.join(',')).toLowerCase().includes(q)));
}
function groupKey(c) {
  if (CH.group === 'up') return UP_BY[c.up].name;
  if (CH.group === 'vendor') return VENDORS[c.vendor];

}
// 返回 [{key, rows}]，并在 CH.rowIds 中记录可见行顺序（框选用）
function groupedRows() {
  const list = filteredChannels();
  const groups = [];
  const idx = {};
  list.forEach((c) => { const k = groupKey(c); if (!(k in idx)) { idx[k] = groups.length; groups.push({ key: k, rows: [] }); } groups[idx[k]].rows.push(c); });
  CH.rowIds = [];
  groups.forEach((g) => { if (!CH.collapsed.has(g.key)) g.rows.forEach((c) => CH.rowIds.push(c.id)); });
  return groups;

function sheetHtml() {
  const cols = visCols();

  if (!groups.length) return `<table class="sheet"><thead>${head}</thead></table><div class="empty"><b>没有符合条件的渠道</b>调整筛选，或从上游批量创建渠道。<br><button class="btn" id="ch-clearf">清除筛选</button> <button class="btn pri" data-batch>批量创建</button></div>`;
  let body = '';
  groups.forEach((g) => {
    if (CH.group !== 'none') {
      const live = g.rows.filter((c) => !c.isNew).map((c) => stOf(c));
      const nn = live.reduce((a, s) => a + s.n, 0);
      const avg = nn ? live.reduce((a, s) => a + s.succ * s.n, 0) / nn : null;
      const cost = live.reduce((a, s) => a + s.cost, 0), off = live.reduce((a, s) => a + s.offUsd, 0);
      const open = !CH.collapsed.has(g.key);
      body += `<tr class="grp" data-g="${esc(g.key)}"><td colspan="${cols.length + 1}"><span class="caret">${open ? '▾' : '▸'}</span>${esc(g.key)}<span class="gm">渠道 <b>${g.rows.length}</b></span><span class="gm">请求 <b>${nn.toLocaleString()}</b></span><span class="gm">成功率 <b>${pct(avg)}</b></span><span class="gm">成本 <b>¥${fmt(cost)}</b></span><span class="gm" title="${esc(TERM.mcoef.t)}">实测成本 <b>${off ? (cost / off).toFixed(3) : '—'}</b></span></td></tr>`;
      if (!open) return;
    }
    g.rows.forEach((c) => {
      body += `<tr class="row ${CH.cur === c.id ? 'cur' : ''} ${c.status !== 'on' ? 'dis' : ''}" data-row="${c.id}"><td class="sticky1"><input type="checkbox" data-chk="${c.id}" ${CH.checked.has(c.id) ? 'checked' : ''}></td>${cols.map((col) => {
        const dirty = c.isNew || isDirty(c, col.id) || (col.id === 'eff' && isDirty(c, 'k'));

      }).join('')}</tr>`;
    });
  });
  return `<table class="sheet"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

// ---------- 价格-质量散点图（R4）：内联 SVG ----------
function scatterSvg(w, vf = 'all', sel = null) {
  const pts = CHANNELS.filter((c) => !c.isNew && (vf === 'all' || c.vendor === vf)).map((c) => ({ c, s: stOf(c, w) })).filter((x) => x.s && x.s.scoef != null);
  if (!pts.length) return '<div class="empty"><b>没有可绘制的渠道</b>该厂商下没有按 token 计费且有价格的渠道。</div>';
  const W = 880, H = 330, L = 52, R = 18, T = 14, B = 40;
  const xs = pts.map((x) => x.s.scoef), ys = pts.map((x) => x.s.succ);
  const lx0 = Math.log(Math.min(...xs) * 0.75), lx1 = Math.log(Math.max(...xs) * 1.3);
  const y0 = Math.min(0.9, Math.floor(Math.min(...ys) * 20) / 20), y1 = 1;
  const X = (v) => L + (W - L - R) * (Math.log(v) - lx0) / ((lx1 - lx0) || 1);
  const Y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const maxN = Math.max(...pts.map((x) => x.s.n));
  let g = '';
  [0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20].filter((t) => Math.log(t) >= lx0 && Math.log(t) <= lx1).forEach((t) => { const x = X(t).toFixed(1); g += `<line class="gl" x1="${x}" x2="${x}" y1="${T}" y2="${H - B}"/><text x="${x}" y="${H - B + 14}" text-anchor="middle">${t}</text>`; });
  const steps = Math.round((y1 - y0) / 0.05);
  for (let k = 0; k <= steps; k++) { const v = y0 + k * 0.05, y = Y(v).toFixed(1); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${+y + 3}" text-anchor="end">${Math.round(v * 100)}%</text>`; }
  g += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">标准负载成本系数（元/官方$，对数刻度，越左越便宜）</text><text x="13" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 13 ${(T + H - B) / 2})">成功率</text>`;
  const dots = pts.sort((a, b) => b.s.n - a.s.n).map(({ c, s }) => {
    const r = 4 + 12 * Math.sqrt(s.n / maxN), low = s.n < 30, on = c.id === sel;
    return `<circle data-c="${c.id}" cx="${X(s.scoef).toFixed(1)}" cy="${Y(s.succ).toFixed(1)}" r="${r.toFixed(1)}" fill="${VENDOR_COLOR[c.vendor]}" fill-opacity="${low ? 0.28 : 0.72}" stroke="${on ? '#111' : low ? VENDOR_COLOR[c.vendor] : '#fff'}" stroke-width="${on ? 2.5 : 1}" ${low ? 'stroke-dasharray="2 2"' : ''}><title>${esc(c.name)}\n标准负载成本 ${s.scoef.toFixed(3)} 元/官方$\n成功率 ${pct(s.succ)}（Wilson 下界 ${pct(s.wil)}）\n请求 ${s.n}${low ? '（样本 < 30）' : ''} · 缓存命中率 ${pct(s.hit, 0)}</title></circle>`;
  }).join('');
  return `<svg class="sc" viewBox="0 0 ${W} ${H}" role="img" aria-label="价格-质量散点图">${g}${dots}</svg>`;
}

function runApply(ov, list) {

  anthropic: { mode: 'follow', markup: 0.25, adj: 0.9, last: '11-05 22:00' },
  openai: { mode: 'manual', markup: 0.2, adj: 1.2, last: '11-06 10:30' },

};
const siteModels = () => uniq(CHANNELS.flatMap((c) => c.models));
const chCount = (m) => CHANNELS.filter((c) => c.models.includes(m)).length;
// 参考成本：该厂商各渠道实测成本系数的最低 / 按流量加权平均 / 主力渠道（请求最多）
function vendorRef(v, w = VP.win) {
  const xs = CHANNELS.filter((c) => !c.isNew && c.vendor === v).map((c) => ({ c, s: stOf(c, w) })).filter((x) => x.s && x.s.mcoef != null);
  if (!xs.length) return null;
  const cost = xs.reduce((a, x) => a + x.s.cost, 0), off = xs.reduce((a, x) => a + x.s.offUsd, 0);
  const main = xs.slice().sort((a, b) => b.s.n - a.s.n)[0];

}
const sugM = (v) => { const r = vendorRef(v), x = VENDOR_PRICE[v]; return r ? r.avg * (1 + x.markup) / S_RATE.v : null; };

// 价格 → NewAPI option：ModelRatio = in ÷ 2；Completion / Cache / CreateCache 为官方比例；按次计费写 ModelPrice
function ratioOf(o) { if (!o) return null; if (o.perCall != null) return { mp: o.perCall }; return { mr: o.in / 2, cr: o.out / o.in, ca: o.cr != null ? o.cr / o.in : null, cc: o.cw5 != null ? o.cw5 / o.in : null }; }

    if (p.ign && st !== 'ok') st = 'ign';

  });

}

function series(n, base, amp, seed) { let s = seed; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647); return Array.from({ length: n }, (_, i) => base + amp * Math.sin(i / n * Math.PI * 2 - 1.2) + amp * 0.5 * (r() - 0.5)); }
// 折线图：lines = [{ data, color, dash, axis:'r' }]
function lineChart(lines, { labels = [], yfmt = (v) => Math.round(v), rmin, rmax, rfmt } = {}) {
  const W = 560, H = 170, L = 40, R = rfmt ? 40 : 10, T = 10, B = 22;
  const left = lines.filter((l) => l.axis !== 'r');
  const all = left.flatMap((l) => l.data);
  const max = Math.max(...all) * 1.1, min = 0;
  const n = lines[0].data.length;
  const x = (i) => L + (W - L - R) * i / (n - 1);
  const y = (v, ax) => ax === 'r' ? T + (H - T - B) * (1 - (v - rmin) / (rmax - rmin)) : T + (H - T - B) * (1 - (v - min) / (max - min));
  let g = '';
  for (let k = 0; k <= 4; k++) { const yy = T + (H - T - B) * k / 4; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 4}" y="${yy + 3}" text-anchor="end">${yfmt(max - (max - min) * k / 4)}</text>`; if (rfmt) g += `<text x="${W - R + 4}" y="${yy + 3}">${rfmt(rmax - (rmax - rmin) * k / 4)}</text>`; }
  labels.forEach((lb, i) => { if (lb) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${lb}</text>`; });
  const paths = lines.map((l) => `<polyline fill="none" stroke="${l.color}" stroke-width="1.6" ${l.dash ? 'stroke-dasharray="4 3"' : ''} points="${l.data.map((v, i) => `${x(i).toFixed(1)},${y(v, l.axis).toFixed(1)}`).join(' ')}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}${paths}</svg>`;
}
function barChart(a, b, { labels = [], ca = '#e0a100', cb = '#2952cc' } = {}) {
  const W = 560, H = 170, L = 40, T = 10, B = 22, n = a.length;
  const max = Math.max(...a, ...b) * 1.1, bw = (W - L - 10) / n;
  let g = '';
  for (let k = 0; k <= 4; k++) { const yy = T + (H - T - B) * k / 4; g += `<line class="gl" x1="${L}" x2="${W - 10}" y1="${yy}" y2="${yy}"/><text x="${L - 4}" y="${yy + 3}" text-anchor="end">${Math.round(max - max * k / 4)}</text>`; }
  const h = (v) => (H - T - B) * v / max;
  a.forEach((v, i) => { const x0 = L + bw * i + bw * 0.15; g += `<rect x="${x0}" y="${H - B - h(v)}" width="${bw * 0.33}" height="${h(v)}" fill="${ca}"/><rect x="${x0 + bw * 0.36}" y="${H - B - h(b[i])}" width="${bw * 0.33}" height="${h(b[i])}" fill="${cb}"/>`; if (labels[i]) g += `<text x="${x0 + bw * 0.35}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

function auditDiff(a) {
  if (a.type === '渠道') return `channel #${a.obj.split('#')[1] || '—'}\n- ${a.sum.split('→')[0]}\n+ ${a.sum.includes('→') ? a.sum.split(' ')[0] + ' ' + a.sum.split('→')[1] : a.sum}`;
  if (a.type === '价格') return 'ModelRatio\n  gpt-5.1:            0.0352 → 0.0359\n  gemini-2.5-pro:     0.0310 → 0.0317\n  claude-sonnet-4-5:  0.0459 （不变）\n…共 10 项';
  return `${a.obj}\n- ${a.sum.split('→')[0]}\n+ ${a.sum.split('→')[1] || ''}`;
}
function auditReq(a) {
  if (a.res === 'err') return 'PUT /api/channel/\n{"id":164,"status":2}\n\n← HTTP 502 Bad Gateway\n<html>…nginx…</html>';
  if (a.type === '渠道') return 'PUT /api/channel/\n{"id":104,"priority":8}\n\n← 200 {"success":true,"message":""}';
  if (a.type === '价格') return 'GET /api/option/ ← 200 (读出 214 个 key)\nPUT /api/option/\n{"key":"ModelRatio","value":"{…}"}\n← 200 {"success":true}\nGET /api/option/ 读回核对 ✓';
  return `PUT /api/option/\n{"key":"${a.obj}","value":"…"}\n← 200 {"success":true}`;
}

        ${GROUPS.map((g) => `<tr><td><input class="inp mono" value="${g.name}" style="width:120px;height:24px"></td><td class="num"><input class="inp mono" value="${g.ratio.toFixed(2)}" style="width:80px;height:24px;text-align:right"></td><td><input class="inp" value="${g.note}" style="width:200px;height:24px"></td><td class="num"><button class="btn sm ghost danger" ${g.name === 'self' ? 'disabled' : ''}>${ic('trash')}</button></td></tr>`).join('')}</tbody></table>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center"><button class="btn sm">${ic('plus')}添加分组</button><span class="mut small">分组名保持简短：渠道 group 字段只有 varchar(64)，内容为所有分组名逗号拼接</span><span style="margin-left:auto"></span><button class="btn sm pri" id="st-grp">保存并写入</button></div>`)}
      ${sec('sec-price', '定价参数', '厂商定价', `<div class="fm"><label>参考成本时长</label><div class="row"><span class="mono">${WIN_NAME[VP.win]}</span><span class="mut small">在“厂商定价”页切换；参考成本 = 渠道实测成本系数（含缓存）</span></div>
        <label>跟随确认阈值</label><div class="row"><input class="inp mono" value="${Math.round(VP.thr * 100)}" style="width:70px"><span class="mut small">%，跟随模式下建议的厂商售价倍率变化超过阈值时需手动确认</span></div>
        <label>标准负载最小样本</label><div class="row"><input class="inp mono" value="30" style="width:70px"><span class="mut small">条；不足时标准负载成本系数灰色显示</span></div>
        <label>自动写入</label><div class="row"><label class="switch"><input type="checkbox" checked><span></span></label><span class="mut small">跟随模式下未超过阈值的变化自动写入；关闭后需在“厂商定价”页手动预览写入</span></div></div>`)}
      ${sec('sec-sched', '调度间隔', '所有任务串行执行', `<div class="fm" style="grid-template-columns:130px 1fr 130px 1fr">${jobs}</div>`)}
      ${sec('sec-keep', '日志保留', '', `<div class="fm"><label>NewAPI 原始日志</label><div class="row"><input class="inp mono" value="30" style="width:70px"><span class="mut small">天；由 nam 定期调用 DELETE /api/log/ 清理</span><span class="tag warn">写 NewAPI</span></div>
        <label>nam 聚合数据</label><div class="row"><input class="inp mono" value="180" style="width:70px"><span class="mut small">天（stats_hourly）</span></div></div>`)}
      ${sec('sec-auto', 'NewAPI 自动禁用 / 恢复', '写 NewAPI option', `<div class="fm"><label>自动禁用</label><div class="row"><label class="switch"><input type="checkbox" checked data-opt="AutomaticDisableChannelEnabled"><span></span></label><span class="mono small mut">AutomaticDisableChannelEnabled</span></div>
        <label>自动恢复</label><div class="row"><label class="switch"><input type="checkbox" checked data-opt="AutomaticEnableChannelEnabled"><span></span></label><span class="mono small mut">AutomaticEnableChannelEnabled</span></div>
        <label>全量定时测试</label><div class="row"><label class="switch"><input type="checkbox" data-opt="monitor_setting.auto_test_channel_enabled"><span></span></label><span class="mut small">保持关闭：只测被自动禁用的渠道</span></div>
        <label>测试间隔</label><div class="row"><input class="inp mono" value="10" style="width:70px"><span class="mut small">分钟（auto_test_channel_minutes）</span></div></div>`)}
      ${sec('sec-bak', '备份', '每天写到挂载卷；备份不含主密钥 NAM_SECRET', `<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn" id="st-bak">${ic('download')}立即备份</button></div>
        <table class="t" style="max-width:640px"><thead><tr><th>文件</th><th class="num">大小</th><th>时间</th><th></th></tr></thead><tbody>
        ${['11-06', '11-05', '11-04', '11-03'].map((d, i) => `<tr><td class="mono">backup/nam-2026-${d}.db</td><td class="num">${(18.4 - i * 0.3).toFixed(1)} MB</td><td class="mono">${d} 03:00</td><td class="num"><button class="btn sm">${ic('download')}下载</button></td></tr>`).join('')}</tbody></table>`)}
      ${sec('sec-pwd', '修改管理员密码', 'argon2id 哈希；修改后其他会话失效', `<div class="fm" style="max-width:520px"><label>当前密码</label><input class="inp" type="password"><label>新密码</label><input class="inp" type="password" placeholder="至少 12 位"><label>确认新密码</label><input class="inp" type="password"><label></label><div><button class="btn pri" id="st-pwd">修改密码</button></div></div>`)}
      </div></div>
    ${infoBox(['NewAPI 连接：地址、root 令牌、用户 ID、测试连接、版本', '站点汇率 S：修改前按厂商预览厂商售价倍率与 ModelRatio 的变化（× 旧S÷新S）、余额重估，二次确认', '用户分组加价：self / friend，可增删，写 GroupRatio', '定价参数（参考成本时长、跟随确认阈值、标准负载最小样本、自动写入）、调度间隔、日志保留', '自动禁用/恢复开关（写 NewAPI option）', '备份：立即备份、下载、最近列表', '修改管理员密码'])}`;
  },
  mount(root) {
    $$('[data-jump]', root).forEach((a) => a.onclick = () => $('#' + a.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }));
    $('#st-test', root).onclick = () => toast('连接正常 · 41ms', 'ok');
    $('#st-s-go', root).onclick = () => {
      const ns = Number($('#st-s', root).value);
      if (!(ns > 0)) { toast('S 必须大于 0', 'err'); return; }
      if (ns === S_RATE.v) { toast('S 未变化'); return; }
      const n = S_RATE.v / ns;
      const vrows = Object.keys(VENDOR_PRICE).map((v) => { const ms = vendorSiteModels(v), x = VENDOR_PRICE[v], ex = ms.map((m) => [m, ratioOf(MODEL_BY[m].site)]).find(([, r]) => r && r.mr != null);
        return ms.length ? `<tr><td>${VENDORS[v]}</td><td class="num">${ms.length}</td><td class="num mono">${x.m0} → ${(x.m0 * n).toFixed(4)}</td><td class="mono small">${ex ? `${esc(ex[0])} ${ex[1].mr.toFixed(4)} → ${(ex[1].mr * n).toFixed(4)}` : '—'}</td></tr>` : ''; }).join('');
      const ov = openModal({ title: '修改站点汇率 S', sub: `${S_RATE.v} → ${ns}`, size: '',
        body: `<p class="small tx2">为保持用户看到的人民币价格不变，各厂商售价倍率 m 与站内 ModelRatio 整体 × <b class="mono">${n.toFixed(4)}</b>（旧 S ÷ 新 S）。按厂商列出变化：</p>
          <table class="t"><thead><tr><th>厂商</th><th class="num">站内模型</th><th class="num">厂商售价倍率 m</th><th>例：ModelRatio</th></tr></thead><tbody>${vrows}
          <tr><td>Price、USDExchangeRate</td><td></td><td class="num mono">${S_RATE.v} → ${ns}</td><td class="c-ok small">用户看到的人民币价格不变</td></tr></tbody></table>
          <div class="note err" style="margin-top:10px">${ic('alert')} 用户已有余额按美元额度计价，会被重新估值：现有 $10 额度原价值 ¥${10 * S_RATE.v}，修改后价值 ¥${10 * ns}。</div>
          <label style="display:flex;gap:6px;margin-top:10px;align-items:center" class="small"><input type="checkbox" id="s-ack"> 我已了解余额重估的影响</label>`,
        foot: '<button class="btn" data-close>取消</button><button class="btn dangerfill" id="s-ok" disabled>确认修改并写入</button>' });
      $('#s-ack', ov).onchange = (e) => { $('#s-ok', ov).disabled = !e.target.checked; };
      $('#s-ok', ov).onclick = () => confirmBox({ title: '再次确认', danger: true, okText: `写入 S = ${ns}`, writes: 'PUT /api/option/ Price, USDExchangeRate, ModelRatio', body: '<p>这是第二次确认。写入后可在写入历史中回滚。</p>', onOk: () => { closeOv(ov); S_RATE.v = ns; Object.values(VENDOR_PRICE).forEach((x) => { x.m0 = +(x.m0 * n).toFixed(4); x.m = +(x.m * n).toFixed(4); }); MODELS.forEach((p) => { if (p.site) p.site = scaleP(p.site, n); }); render(); toast(`S 已改为 ${ns}`, 'ok'); } });
    };
    $('#st-grp', root).onclick = () => confirmBox({ title: '写入用户分组加价', writes: 'PUT /api/option/ GroupRatio, UserUsableGroups', body: '<p>GroupRatio <span class="mono">{"self":1,"friend":1.2}</span>，同时把分组名写入 UserUsableGroups。渠道 group 字段已是 <span class="mono">self,friend</span>。</p>', onOk: () => toast('已写入 NewAPI', 'ok') });
    $$('[data-opt]', root).forEach((x) => x.onchange = () => { const v = x.checked; x.checked = !v; confirmBox({ title: '修改 NewAPI 设置', writes: `PUT /api/option/ ${x.dataset.opt}=${v}`, body: `<p>把 <span class="mono">${x.dataset.opt}</span> 改为 <b>${v}</b>。</p>`, onOk: () => { x.checked = v; toast('已写入 NewAPI', 'ok'); } }); });
    $('#st-bak', root).onclick = () => toast('备份完成：backup/nam-2026-11-06.db', 'ok');
    $('#st-pwd', root).onclick = () => confirmBox({ title: '修改管理员密码', okText: '修改', body: '<p>修改后所有其他会话将失效。</p>', onOk: () => toast('密码已修改', 'ok') });
  },
};

// ---------- 启动 ----------
render();

</script>
</body>
</html>
